# 生产监控名单与贡献车道。外部仓库须与 cloudflare/wrangler.toml 一致。
# observe 仍扫描，只记录机械拦截原因，交由人工认领、审核或发布。

defaults:
  unknown_repo_action: hold_for_review
  auto_comment: false
  auto_pr: false
  min_issue_age_hours: 2
  # 2026-11-03：改成真数字。此前 abort 无条件归还额度，"每天 N 个"是假的
  # （实测一天 claim 50 次、sqlite 只剩 2 条）。现在只有环境故障才归还。
  max_new_claims_per_business_day: 5
  allow_force_push: false
  allow_merge_upstream: false

repositories:
  agentgateway/agentgateway: {lane: open}
  clickhouse/clickhouse: {lane: open}
  modelcontextprotocol/rust-sdk: {lane: observe, review_reason: "人工发布 · MCP 要求披露 AI 参与范围"}
  qdrant/qdrant: {lane: observe, review_reason: "人工发布 · PR 动机需本人撰写并披露 AI 使用"}
  ruvnet/RuVector: {lane: open}
  bytecodealliance/wasmtime: {lane: open}
  kubescape/kubescape: {lane: observe, review_reason: "人工认领 · 先在 issue 留言并完成指派"}
  agentscope-ai/agentscope-java: {lane: open}
  kgateway-dev/kgateway: {lane: open}
  spring-projects/spring-boot: {lane: open}
  sqlfluff/sqlfluff: {lane: observe, review_reason: "人工审核 · 披露 AI 参与和人工验测内容"}
  python/typeshed: {lane: open}
  PyO3/pyo3: {lane: open}
  redis/redis-py: {lane: open}
  bytecodealliance/wasm-tools: {lane: open}
  delta-io/delta-rs: {lane: observe, review_reason: "人工审核 · 审查生成代码并披露 AI 使用"}
  infiniflow/ragflow: {lane: open}
  bytedance/deer-flow: {lane: open}
  NVIDIA/NeMo-Agent-Toolkit: {lane: observe, review_reason: "人工认领 · 开工前先在 issue 留言"}
  psf/black: {lane: open}
  istio/istio: {lane: open}
  pypa/pipx: {lane: open}
  tox-dev/tox: {lane: open}
  caddyserver/caddy: {lane: open}
  strands-agents/harness-sdk: {lane: observe, review_reason: "人工审核 · PR 概述需本人填写"}
  moby/buildkit: {lane: open}
  docker/compose: {lane: open}
  firecracker-microvm/firecracker: {lane: open}
  milvus-io/milvus: {lane: open}
  envoyproxy/envoy: {lane: open}
  volcengine/OpenViking: {lane: open}
  traefik/traefik: {lane: open}
  pypa/virtualenv: {lane: open}
  docling-project/docling: {lane: open}
  Unstructured-IO/unstructured: {lane: open}
  apache/dubbo-go: {lane: open}
  oceanbase/powercontext: {lane: open}
  prettier/prettier: {lane: open}
  pydantic/monty: {lane: open}
  oras-project/oras: {lane: open}
  python-poetry/poetry: {lane: open}
  pypa/pip: {lane: open}
  redis/go-redis: {lane: open}
  valkey-io/valkey: {lane: open}
  pydantic/logfire: {lane: open}
  rclone/rclone: {lane: observe, review_reason: "人工审核 · 需理解改动并完成项目验测"}
  prometheus/prometheus: {lane: observe, review_reason: "人工审核 · 提交者需理解 AI 生成的代码"}
  django/django: {lane: open}
  HKUDS/RAG-Anything: {lane: open}
  dagger/dagger: {lane: open}

  # 内部 fixture，不进 Worker 扫描名单。
  xixi-box/oss-scout-v2-test: {lane: open, internal: true}
