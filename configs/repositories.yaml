# 仓库策略（计划 §6）。
#
# 2026-10-30 重建：从 173 个扫描池仓库里筛出 38 个**真正方便贡献**的。
# 筛选依据见 docs/best_repos.md：外部贡献者合并率 ≥55%、语言为 Python/Go
# （自动化验证成本最低）、无 PR 门禁。
#
# 仓库本身不做"难度评级"——能不能做由 AI 对单条 issue 的判断决定。
# 这里只记录车道（open/gated）和个别仓库的项目特殊规则。

defaults:
  unknown_repo_action: hold_for_review
  auto_comment: false
  auto_pr: false
  min_issue_age_hours: 2
  max_new_claims_per_business_day: 1
  allow_force_push: false
  allow_merge_upstream: false

repositories:
  # ---- Python (19) ----
  PrefectHQ/prefect: {lane: open}
  aio-libs/aiohttp: {lane: open}
  ansible/ansible-lint: {lane: open}
  apache/airflow: {lane: open}
  deepset-ai/haystack: {lane: open}
  fivetran/great_expectations: {lane: open}
  googleapis/python-genai: {lane: open}
  microsoft/playwright-python: {lane: open}
  numpy/numpy: {lane: open}
  openai/openai-python: {lane: open}
  pandas-dev/pandas: {lane: open}
  psf/black: {lane: open}
  pypa/pip-tools: {lane: open}
  pypa/virtualenv: {lane: open}
  python-poetry/poetry: {lane: open}
  scipy/scipy: {lane: open}
  tox-dev/tox: {lane: open}
  unionai-oss/pandera: {lane: open}

  # ---- Go (19) ----
  argoproj/argo-cd: {lane: open}
  argoproj/argo-workflows: {lane: open}
  crossplane/crossplane: {lane: open}
  docker/compose: {lane: open}
  etcd-io/etcd: {lane: open}
  fluxcd/flux2: {lane: open}
  gofiber/fiber: {lane: open}
  hashicorp/consul: {lane: open}
  hashicorp/terraform: {lane: open}
  jackc/pgx: {lane: open}
  k3s-io/k3s: {lane: open}
  linkerd/linkerd2: {lane: open}
  moby/moby: {lane: open}
  prometheus/prometheus: {lane: open}
  pulumi/pulumi: {lane: open}
  rancher/rancher: {lane: open}
  redis/go-redis: {lane: open}
  traefik/traefik: {lane: open}
  urfave/cli: {lane: open}

  # ---- 特殊规则 ----
  # litellm 只做维护者确认过的 issue，且 PR 必须带测试
  BerriAI/litellm: {lane: restricted, only: maintainer_confirmed, pr_rules: [tests_required]}

  # ---- 内部测试仓库（不承载真实开源贡献）----
  xixi-box/oss-scout-v2-test: {lane: open, internal_test_repo: true}
