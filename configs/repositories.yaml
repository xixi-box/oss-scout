# 监控名单与车道。**只有本文件列出的仓库才会被扫描**（改名单只改这里）。
#
# 准入依据（2026-11-03 重构）：三个实测指标合成 0-100 分，见
# scout_v2/repo_score.py 的权重说明：
#   外部合并率（45%）  外部贡献能不能被合；0% 意味着写得多好都白费
#   中位合并耗时（35%）一次往返要多久；指数衰减，24h 满分
#   外部 PR/周（20%）  一年有多少次机会；log 压缩
# 50 分以下不入池。本文件全部为 A 档（≥70 分）。
#
# 已否决（不要再加回来）：
#   astral-sh/uv、astral-sh/ruff、astral-sh/rye  组织 AI 政策禁止自主 agent
#   biomejs/biome          维护者 ematipico："I'll ban this account, it's AI garbage"
#   vllm-project/vllm      pre-run-check 要 4+ merged PR，明写不许 AI agent 申请标签
#   weaviate/weaviate      外部合并率 0%；禁止 bulk automated changes
#   pydantic/pydantic-ai   外部合并率 5%、中位 378h
#   supabase/supabase      Vercel 是 required status check，fork 永远过不了
#   mem0ai/mem0、chroma-core/chroma、vectorize-io/hindsight、dxos/dxos、
#   tldraw/tldraw          外部合并率均为 0%
#   microsoft/playwright(-python)  issue 须先 triage approve + EasyCLA
#   langchain-ai/langchain 未指派即自动关 PR

defaults:
  unknown_repo_action: hold_for_review
  auto_comment: false
  auto_pr: false
  min_issue_age_hours: 2
  # 2026-11-03：改成真数字。此前 abort 无条件归还额度，"每天 N 个"是假的
  # （实测一天 claim 50 次、sqlite 只剩 2 条）。现在只有环境故障才归还。
  max_new_claims_per_business_day: 5
  allow_force_push: false
  allow_merge_upstream: false

