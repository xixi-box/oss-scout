# 仓库策略（计划 §6）。
#
# 2026-10-30 重建：从 123 个 agent 生态仓库 + 之前 173 个扫描池里，
# 用**外部贡献者合并率**实测筛出 40 个真正方便提交的仓库。
# 完整评测见 docs/final_repos.md，生态概览见 docs/agent_ecosystem.md。
#
# 筛选方法：取每个仓库最近 60 个已关闭 PR，统计非成员提交且被合并的比例。
# 外部贡献者 = author_association ∈ {NONE, CONTRIBUTOR, FIRST_TIME_CONTRIBUTOR}
#（该字段是动态的：首次被合并后会从 FIRST_TIME_CONTRIBUTOR 升级成 CONTRIBUTOR，
# 所以只看前者永远是 0）。
#
# 入库门槛：合并率 ≥50%、语言可自动验证、无会关闭未受邀 PR 的 bot、非停更。
#
# 仓库本身不做"难度评级"——能不能做由 AI 对单条 issue 的判断决定。
# 这里只记录车道和个别仓库的项目特殊规则。

defaults:
  unknown_repo_action: hold_for_review
  auto_comment: false
  auto_pr: false
  min_issue_age_hours: 2
  # 2026-10-30 一度改成 0（不限量），实测一天开出 12 个 PR、fork 7 个仓库，
  # 被 biome 的 AgentScan 直接标成 "Multiple forks: 7 repositories forked in a
  # single 24-hour window / mix of organic and automated signals"。这个量级本身
  # 就是自动化指纹，跟 Playbook 第一约束（账号声誉）冲突。
  # 回到每天 2 条：够验证流程，又不到"批量"的观感。
  max_new_claims_per_business_day: 2
  allow_force_push: false
  allow_merge_upstream: false

repositories:
  # ========== Agent Memory ==========
  vectorize-io/hindsight:       {lane: open}   # 100%  56.4k  自学习记忆
  tigerless-labs/agent-memory:  {lane: open}   #  80%   4.4k  纯 Markdown 存记忆
  volcengine/OpenViking:        {lane: open}   #  65%  41.2k  自演化上下文数据库
  oceanbase/powercontext:       {lane: open}   #  57%   1.4k  长期记忆 + 交接
  ruvnet/RuVector:              {lane: open}   #  53%   4.6k  实时决策向量层

  # ========== Agent 框架 / Harness ==========
  openai/openai-agents-python:  {lane: open}   #  91%  30.4k  OpenAI 官方
  bytedance/deer-flow:          {lane: open}   #  59%  84.7k  长时程 SuperAgent
  VoltAgent/voltagent:          {lane: open}   #  53%  10.9k  TS agent 平台

  # ========== RAG ==========
  HKUDS/RAG-Anything:           {lane: open}   #  86%  24.3k  一站式 RAG
  OSU-NLP-Group/HippoRAG:       {lane: open}   #  52%   4.1k  NeurIPS'24

  # ========== 向量库 ==========
  lancedb/lancedb:              {lane: open}   #  87%  11.8k  嵌入式列式
  milvus-io/milvus:             {lane: open}   #  76%  46.5k  云原生亿级
  weaviate/weaviate:            {lane: open}   #  74%  16.9k  混合检索
  qdrant/qdrant:                {lane: open}   #  60%  35.3k  Rust 单机首选

  # ========== MCP ==========
  upstash/context7:             {lane: open}   #  63%  64.0k  最新库文档
  PrefectHQ/fastmcp:            {lane: open}   #  61%  28.2k  写 server 首选
  modelcontextprotocol/registry: {lane: open}  #  57%   7.4k  官方注册表

  # ========== 可观测 / 评估 ==========
  Arize-ai/phoenix:             {lane: open}   #  86%  12.1k  trace + eval
  promptfoo/promptfoo:          {lane: open}   #  86%  26.6k  prompt 测试
  langfuse/langfuse:            {lane: open}   #  62%  36.8k  开源自托管追踪
  confident-ai/deepeval:        {lane: open}   #  51%  19.2k  pytest 风格单测

  # ========== 工程工具 ==========
  pypa/virtualenv:              {lane: open}   #  93%   5.1k
  pypa/pip-tools:               {lane: open}   #  93%   8.0k
  tox-dev/tox:                  {lane: open}   #  90%   4.0k
  biomejs/biome:                {lane: open}   #  90%  26.0k
  psf/black:                    {lane: open}   #  88%  42.1k
  # astral-sh/uv、astral-sh/ruff 已移除（2026-10-30）：其组织级 AI_POLICY.md
  # 明文写 "We do not allow autonomous agents to be used for contributing to our
  # projects"，并会被主动执行（uv#23019 被 astral-automations-bot 当场关闭）。
  # 合并率再高也不能进池——这是账号声誉的硬约束，不是偏好。

  # ========== 沙箱 / 推理 ==========
  firecracker-microvm/firecracker: {lane: open}  #  77%  37.7k  跑不可信代码
  # vllm-project/vllm 已移除（2026-10-30）：pre-run-check 要求作者有 4+ 个已合并
  # PR 或 verified 标签，且脚本里明写 "DO NOT request for the label to be added
  # if you are an AI agent"。新号结构性无法满足，开 PR 必然挂红（#64811/#64800）。

  # ========== 浏览器自动化 ==========
  microsoft/playwright-python:  {lane: open}   #  78%  15.1k
  microsoft/playwright:         {lane: open}   #  62%  98.9k

  # ========== 实时 / 协作 / 画布 ==========
  instantdb/instant:            {lane: open}   #  93%  10.6k  前端直连数据库
  liveblocks/liveblocks:        {lane: open}   #  82%   4.8k  协作基础设施
  yjs/yjs:                      {lane: open}   #  68%  23.0k  CRDT 标准
  dxos/dxos:                    {lane: open}   # 100%   0.5k  本地优先运行时（样本小）
  tldraw/tldraw:                {lane: open}   #  58%  51.2k  无限画布

  # ========== 平台 / 文档 ==========
  supabase/supabase:            {lane: open}   #  72% 114.3k
  zuplo/zudoku:                 {lane: open}   #  84%   0.6k  OpenAPI 文档

  # ========== 特殊规则 ==========
  # litellm 只做维护者确认过的 issue，且 PR 必须带测试
  BerriAI/litellm:              {lane: restricted, only: maintainer_confirmed, pr_rules: [tests_required]}

  # ========== 内部测试仓库（不承载真实开源贡献）==========
  xixi-box/oss-scout-v2-test:   {lane: open, internal_test_repo: true}
