# 仓库 PR 门禁（2026-11-03 重建）。
#
# 判据只认一件事：**会不会自动关闭未受邀/未指派的 PR**。
# 入池时已核实全部为 false；未在此声明的一律 fail-closed（true）。
#
# CLA 段保留：将来人工撞 CLA 时用得上，自动化流程只处理 comment_sign 类。

defaults:
  requires_invite: true
  invite_labels:
    - "open for pull requests"
    - "help wanted"
    - "good first issue"
    - "ready-for-dev"
    - "accepted"

cla:
  # 2026-11-03 按实际机制分类。三种处理完全不同：
  #
  #   comment_sign  在 PR 里回一句固定话即完成，代码可自动发 → 全自动
  #   cla-assistant 点链接走 GitHub OAuth，一次性，需人工 → 预检拦截
  #   microsoft     EasyCLA，PR 里回 @microsoft-github-policy-service agree → 可自动
  #   google        网页表单（cla.developers.google.com），需人工 → 预检拦截
  #
  # 已核实**不需要签**的（CONTRIBUTING 里提到 CLA 但实际没启用）：
  #   caddyserver/caddy  cla-assistant 页面 Version 为空、近期外部 PR 无 CLA bot 评论
  #   redis/redis        CLA 嵌在正文，"贡献即视为同意"，无签署入口（已移出池）
  "microsoft/autogen":       {service: comment_sign, phrase: "@microsoft-github-policy-service agree"}
  "google-gemini/gemini-cli": {service: google}
  "clickhouse/clickhouse":   {service: comment_sign, phrase: "I accept the ClickHouse Individual CLA"}
  "logseq/logseq":           {service: comment_sign, phrase: "I have read the CLA Document and I hereby sign the CLA"}
  "cockroachdb/cockroach":   {service: cla-assistant}
  "Arize-ai/phoenix":        {service: comment_sign, phrase: "I have read the CLA Document and I hereby sign the CLA"}
  "BerriAI/litellm":         {service: cla-assistant}

