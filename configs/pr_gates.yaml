# 仓库 PR 门禁（2026-10-30，基于核实过的 workflow 实际行为）。
#
# 判据只认一件事：**会不会自动关闭未受邀/未指派的 PR**。
# 不看"外部贡献多不多"——那与门禁无关（langchain 就是按此误判过）。
#
# 待核查记录（曾判定为门禁、核实后确认开放）：
#   oven-sh/bun     close-linked-issues.yml 是 PR 合并后关 issue，不是关 PR
#   typeorm/typeorm assign-milestone.yml 里的 closed 是查里程碑状态
#   astral-sh/uv    promote-pull-request.yml 是发版晋升
#   pnpm/pnpm       只打标签 + 自动指派作者
#   argoproj/argo-cd 只把 PR 作者设为 assignee
#
# 已剔除出池（确有硬门禁）：
#   pydantic/pydantic, langchain-ai/langchain, langchain-ai/langgraph,
#   pydantic/pydantic-ai, sqlalchemy/sqlalchemy

defaults:
  requires_invite: true
  invite_labels:
    - "open for pull requests"
    - "help wanted"
    - "good first issue"
    - "ready-for-dev"
    - "accepted"

repositories:
  BerriAI/litellm: {requires_invite: false}
