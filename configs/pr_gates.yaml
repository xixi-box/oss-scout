# 仓库 PR 门禁（2026-10-30 全量核查后重建）。
#
# 判据只认一件事：**这个仓库会不会自动关闭未受邀/未指派的 PR**。
# 不看「外部贡献多不多」——那与门禁无关（langchain 就是按此误判过一次）。
#
# 核查方式：读每个仓库 .github/workflows 下的实际脚本，确认是否调
# pulls.update(state=closed) 或同类逻辑。已排除两类误判：
#   - 「PR 合并后关闭关联 issue」（oven-sh/bun close-linked-issues.yml）
#   - 「给 PR 分配里程碑/项目」（typeorm assign-milestone.yml）
#
# requires_invite: true  → 必须先拿到 invite_labels 里的标签才开 PR
# requires_invite: false → 直接开 PR
# 未声明的仓库走 defaults（true，fail-closed）。

defaults:
  requires_invite: true
  invite_labels:
    - "open for pull requests"
    - "help wanted"
    - "good first issue"
    - "ready-for-dev"
    - "accepted"

repositories:

  # ---- 硬门禁：会关闭未受邀 PR（核实过 workflow 实际行为）----
  pydantic/pydantic:
    requires_invite: true
    note: "enforce-issue-assignment.yml 会 close 未指派 PR（除非带 skip-assignment-check 标签）"
  langchain-ai/langchain:
    requires_invite: true
    note: "require-issue-link / reopen_on_assignment 会 close 未指派 PR（2026-10-30 #41571 实测）"
  langchain-ai/langgraph:
    requires_invite: true
    note: "require_issue_link.yml 会 close 未指派 PR"
  pydantic/pydantic-ai:
    requires_invite: true
    note: "未指派 PR 会被自动关闭（AGENTS.md §6 已有记录）"
  sqlalchemy/sqlalchemy:
    requires_invite: true
    note: "sqla-tester bot 只接受带了 open for pull requests 的 issue（2026-10-28 #13736 实测）"

  # ---- 需要先评论认领（不关 PR，但方案未对齐会白做）----
  fivetran/great_expectations:
    requires_invite: false
    note: "需要先 /assign-me 认领，否则 issue 可能被他人锁定"

  # ---- 核实为开放：明确允许直接开 PR ----
