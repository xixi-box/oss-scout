_meta:
  updated: '2026-11-15'
rules:
  symfony/ai:
    note: Target main with component-prefixed titles and fill in the PR template.
      Link the issue, keep bug fixes backward compatible, and leave CHANGELOG.md and
      UPGRADE.md alone. Use Composer and ./link so PHPUnit tests run against the worktree.
  project-zot/zot:
    note: Keep bug fixes focused and add regression tests. Discuss substantial changes
      in the issue before implementation. Link the issue and include test results, a release
      note for user-facing changes, Conventional Commits, and DCO sign-off.
  kagent-dev/kagent:
    note: Only automate small bug fixes with fewer than 100 changed lines including regression tests, using the direct small-change PR workflow. Large changes, features and refactors require prior discussion and an agreed plan and must be rejected from automatic repair. Respect existing assignments and claims. Every commit needs DCO sign-off. API, persistence, lifecycle or Kubernetes behavior needs the repository-required real E2E coverage; if it cannot be verified, reject the candidate. Do not split large changes to bypass these limits.
  apache/camel-quarkus:
    note: Link an existing GitHub issue and follow the PR template and current contributor guide. Prefer focused JVM module fixes with a real reproducible regression. Establish availability of required GraalVM native-image, external services or credentials before accepting bugs that depend on them; reject if required validation is unavailable. JVM-only tests cannot prove native-image fixes. Run affected module tests and required formatting; no dependency upgrades or CI changes. Follow Apache provenance and licensing guidance and disclose material tool use when required without claiming human review that did not occur.
  agentgateway/agentgateway:
    note: ''
  clickhouse/clickhouse:
    note: ''
  modelcontextprotocol/rust-sdk:
    note: Disclose the scope of AI assistance. Include a clear rationale and reproducible
      tests.
  qdrant/qdrant:
    note: Base branch dev. State the motivation and disclose AI assistance and the
      public repair task.
  ruvnet/RuVector:
    note: ''
  gptme/gptme:
    note: '优先处理标记为 autonomous-friendly 且 status: ready 的问题；开工前按指南认领，跳过 needs-human-judgment，使用 Conventional Commits 并运行相关测试。'
  agentscope-ai/agentscope-java:
