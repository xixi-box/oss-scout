# Cloudflare Worker 配置。
#
# 密钥不在这个文件里：api_token / ingest_token 由环境变量注入
# （GitHub Secrets → 容器，见 .github/workflows/deploy.yml）。
# 2026-10-31 仓库转公开时把真实 token 从版本库和全部历史中移除了。
#
# 环境变量名：
#   CF_API_TOKEN        Cloudflare API token（读写 KV）
#   CF_INGEST_TOKEN     Worker → dashboard 的共享密钥
#   CF_ACCOUNT_ID       可选覆盖下面这行
#   CF_KV_NAMESPACE_ID  可选覆盖下面这行

