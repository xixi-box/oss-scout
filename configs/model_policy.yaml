# OpenCode 模型策略（计划 §11）。
# 2026-10-25 用户决定：免费模型全部弃用（当日目录里 6 个 -free 模型不用，免费偏好
# 记录已按用户要求移除——模型目录变化快，历史快照见 git 历史），只用 Go 订阅内的
# DeepSeek v4.1 Flash。回退链机制保持不变（primary 失败即暂停，无第二付费兜底）。

mode: fixed
allow_paid_api: true           # 用户批准：OpenCode Go 订阅（订阅额度内，无额外按 token 计费）
billing_basis: opencode_go_subscription
max_retries_per_model: 1

primary_models:
  - "opencode-go/deepseek-v4.1-flash"

paid_fallback:
  enabled: false
