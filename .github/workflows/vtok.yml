name: verify tok
on:
  workflow_dispatch:
jobs:
  v:
    runs-on: [self-hosted, aliyun]
    steps:
      - shell: bash
        run: |
          docker exec oss-scout python -c "
import os, yaml
from pathlib import Path
f = yaml.safe_load(open('/data/configs/cloudflare.yaml'))
print('file_api_token empty:', f.get('api_token') == '')
print('env CF_API_TOKEN set:', bool(os.environ.get('CF_API_TOKEN')))
print('env CF_INGEST_TOKEN set:', bool(os.environ.get('CF_INGEST_TOKEN')))
import sys; sys.path.insert(0,'/app')
from dashboard import data as D
class DS: root = Path('/data')
cfg = D.cloudflare_cfg(DS())
print('effective api_token present:', bool(cfg.get('api_token')))
print('effective ingest_token present:', bool(cfg.get('ingest_token')))
"
