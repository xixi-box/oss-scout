name: final check
on: {workflow_dispatch: {}}
jobs:
  c:
    runs-on: [self-hosted, aliyun]
    steps:
      - run: |
          docker exec oss-scout python -c "
          from pathlib import Path
          from scout_v2.workers import cla
          for r in ['Arize-ai/phoenix','mem0ai/mem0','langfuse/langfuse','microsoft/playwright']:
              p = cla.preflight(Path('/data'), r)
              print(f'{r:26s} blocking={str(p[\"blocking\"]):5s} {p[\"url\"]}')
          "
