name: Check prod config
on: {workflow_dispatch: {}}
jobs:
  c:
    runs-on: [self-hosted, aliyun]
    steps:
      - run: |
          docker exec oss-scout sh -c '
            echo "--- /data/configs/repositories.yaml ---"
            grep -E "max_new_claims|astral-sh|vllm-project" /data/configs/repositories.yaml || echo "(none)"
            echo "count: $(grep -cE "^  [a-zA-Z0-9_.-]+/" /data/configs/repositories.yaml)"
            echo "--- image configs.seed ---"
            grep -E "max_new_claims|astral-sh|vllm-project" /app/configs.seed/repositories.yaml || echo "(none)"
            echo "count: $(grep -cE "^  [a-zA-Z0-9_.-]+/" /app/configs.seed/repositories.yaml)"
          '
