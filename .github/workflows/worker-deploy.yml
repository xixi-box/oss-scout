name: worker deploy

# 部署 Cloudflare Worker。Worker 是独立于 Docker 镜像的部署单元：
# REPOS / PRS 这类 vars 改动只有重新 deploy 才会生效。
#
# 用 npx wrangler 而不是预装：部署机只需 node。token 从 Secrets 注入，
# 不走 wrangler login（见 cloudflare/README.md）。
on:
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only validate the bundle, do not publish"
        type: boolean
        default: false
jobs:
  deploy:
    # The Worker deploy only calls Cloudflare and does not need the app's deployment host.
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Show planned repo list
        shell: bash
        run: |
          python3 - <<'PY'
          import re, pathlib
          t = pathlib.Path("cloudflare/wrangler.toml").read_text(encoding="utf-8")
          m = re.search(r'REPOS = "([^"]*)"', t)
          items = [x.strip() for x in m.group(1).split(",") if x.strip()]
          print(f"REPOS count: {len(items)}")
          for r in items[-4:]:
              print(f"  tail: {r}")
          PY

      - name: Deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8b5f2575c2c2f0dd4d6e4eaa3d4e7530
        run: |
          set -euo pipefail
          cd cloudflare
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAGS="--dry-run"; fi
          npx --yes wrangler@4 deploy $FLAGS

      - name: Verify live roster, schedule and authenticated edge
        if: inputs.dry_run != true
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8b5f2575c2c2f0dd4d6e4eaa3d4e7530
          CF_INGEST_TOKEN: ${{ secrets.CF_INGEST_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import tomllib
          from urllib.error import HTTPError
          from urllib.request import HTTPRedirectHandler, Request, build_opener, urlopen

          with open("cloudflare/wrangler.toml", "rb") as source:
              cfg = tomllib.load(source)
          workers = f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CLOUDFLARE_ACCOUNT_ID']}/workers"
          base = f"{workers}/scripts/{cfg['name']}"
          headers = {"Authorization": f"Bearer {os.environ['CLOUDFLARE_API_TOKEN']}"}

          def read(path):
              with urlopen(Request(base + path, headers=headers), timeout=20) as response:
                  return json.load(response)["result"]

          bindings = read("/settings")["bindings"]
          repos = next(b["text"] for b in bindings if b["name"] == "REPOS").split(",")
          assert len(set(repos)) == 57 and repos == cfg["vars"]["REPOS"].split(","), "live roster mismatch"
          tracked = next(b["text"] for b in bindings if b["name"] == "TRACKED_REPOS").split(",")
          assert len(set(tracked)) == 58 and tracked == cfg["vars"]["TRACKED_REPOS"].split(","), "live PR roster mismatch"
          assert {r.lower() for r in tracked} - {r.lower() for r in repos} == {"clickhouse/clickhouse"}
          schedules = [item["cron"] for item in read("/schedules")["schedules"]]
          assert schedules == ["* * * * *"], "live schedule mismatch"
          print("Live Worker: exact 57-repository issue scan every minute; PR comment polling removed (58 tracked repositories)")

          with urlopen(Request(f"{workers}/subdomain", headers=headers), timeout=20) as response:
              subdomain = json.load(response)["result"]["subdomain"]
          assert re.fullmatch(r"[a-z0-9-]+", subdomain), "invalid workers.dev subdomain"
          token = os.environ["CF_INGEST_TOKEN"].strip()
          assert token, "Missing CF_INGEST_TOKEN for authenticated edge verification"

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          request = Request(
              f"https://{cfg['name']}.{subdomain}.workers.dev/internal/v1/status",
              data=b"{}", headers={"Content-Type": "application/json",
                                   "User-Agent": "oss-scout-controller/1.0", "X-Ingest-Token": token})
          try:
              with build_opener(NoRedirect()).open(request, timeout=20) as response:
                  status = json.load(response)
          except HTTPError as exc:
              raise SystemExit(f"Authenticated Cloudflare edge status failed (HTTP {exc.code})") from None
          expected = {"status", "issue-context", "pr-snapshot", "repository-policy",
                      "competition-search", "reference-fact", "feishu-record-index"}
          assert status.get("complete") is True and status.get("ingress") is True and (
              expected <= set(status.get("routes", []))), "Cloudflare edge capabilities incomplete"
          print("Live Worker: authenticated edge routes and durable ingress verified")
          PY
