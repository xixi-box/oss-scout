name: oss-scout pr fix worker

# 我们自己的 PR 上 CI 挂了、且判定与我们的改动相关时，在这个分支上跑 opencode
# 修复并推新 commit（带签名，不 force-push）。
#
# 与 repair workflow 的区别：repair 面向"修一个上游 issue"（复现→补丁→开 PR）；
# 这里面向"已开出的 PR 上补 CI"——checkout 我们 fork 的分支，修完推回同一分支，
# 不开新 PR。触发者是 VPS 的 pr-watch 循环（monitor_prs.dispatch_pr_fix），
# 每个 (pr, head_sha) 只派一次，防循环。
#
# 输入统一走 base64 JSON（log 片段里什么字符都可能有，表单直传会碎）。

on:
  workflow_dispatch:
    inputs:
      fix_b64:
        description: "base64(JSON): fork_repo/branch/upstream_repo/pr_number/head_sha/failing/comments"
        required: true
        type: string
      job_id:
        description: "dedup key"
        required: true
        type: string

permissions:
  contents: read

jobs:
  prfix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Decode payload
        id: job
        shell: bash
        env:
          FIX_B64: ${{ inputs.fix_b64 }}
        run: |
          set -euo pipefail
          printf '%s' "$FIX_B64" | base64 -d > "$RUNNER_TEMP/fix.json"
          python3 - <<'PY'
          import json, os
          j = json.load(open(os.environ["RUNNER_TEMP"] + "/fix.json"))
          print("pr:", j["upstream_repo"], "#", j["pr_number"],
                "| branch:", j["branch"], "| head:", j["head_sha"][:10])
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"fork_repo={j['fork_repo']}\nbranch={j['branch']}\n")
          PY

      - name: Checkout PR branch from fork
        shell: bash
        env:
          FORK_REPO: ${{ steps.job.outputs.fork_repo }}
          BRANCH: ${{ steps.job.outputs.branch }}
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/repo"
          git -C "$RUNNER_TEMP/repo" remote add origin "https://github.com/${FORK_REPO}.git"
          git -C "$RUNNER_TEMP/repo" fetch --depth 5 origin "$BRANCH"
          git -C "$RUNNER_TEMP/repo" checkout -B "$BRANCH" FETCH_HEAD
          echo "checked out $(git -C "$RUNNER_TEMP/repo" rev-parse HEAD)"

      - name: Get oss-scout worker
        uses: actions/checkout@v4
        with:
          path: worker

      - name: Install worker requirements
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages \
            -r "$GITHUB_WORKSPACE/worker/requirements.txt"
          python3 -m pip install --quiet --break-system-packages uv poetry || true

      - name: Install target repo dependencies
        shell: bash
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP/repo"
          PIP="python3 -m pip install --quiet --break-system-packages"
          if [ -f uv.lock ]; then
            uv sync --quiet || echo "WARN: uv sync failed"
          elif [ -f poetry.lock ]; then
            poetry install --quiet || echo "WARN: poetry install failed"
          elif [ -f package.json ]; then
            (command -v npm >/dev/null && npm install --silent) || echo "WARN: npm install failed"
          elif [ -f requirements.txt ]; then
            $PIP -r requirements.txt || echo "WARN: requirements install failed"
          elif [ -f pyproject.toml ]; then
            $PIP -e . || echo "WARN: pip install -e . failed"
          fi

      - name: Install OpenCode CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://opencode.ai/install | bash -s -- --no-modify-path
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          "$HOME/.opencode/bin/opencode" --version

      # 仓库有 go.mod 就装 Go：worker 用 go test 验证改动，
      # 没工具链就只能标 unverified，那样补丁推不出去。
      - name: Detect Go toolchain need
        id: go
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/repo/go.mod" ]; then
            VER=$(sed -n 's/^go \([0-9][0-9.]*\).*/\1/p' "$RUNNER_TEMP/repo/go.mod" | head -1)
            echo "needs=yes" >> "$GITHUB_OUTPUT"
            echo "version=$VER" >> "$GITHUB_OUTPUT"
            echo "go.mod wants go$VER"
          else
            echo "needs=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        if: steps.go.outputs.needs == 'yes'
        with:
          go-version: ${{ steps.go.outputs.version }}
          check-latest: true

      - name: Write opencode auth
        shell: bash
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/opencode"
          python3 - <<'PY'
          import json, os
          p = os.path.expanduser("~/.local/share/opencode/auth.json")
          os.makedirs(os.path.dirname(p), exist_ok=True)
          with open(p, "w") as f:
              json.dump({"opencode-go": {"type": "api",
                                         "key": os.environ["OPENCODE_API_KEY"]}}, f)
          os.chmod(p, 0o600)
          PY

      - name: Run opencode fix
        shell: bash
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/worker"
          PYTHONPATH="$GITHUB_WORKSPACE/worker" python3 -m scout_v2.workers.pr_fix \
            --fix "$RUNNER_TEMP/fix.json" \
            --repo-dir "$RUNNER_TEMP/repo" | tee "$RUNNER_TEMP/prfix.json"

      - name: Commit and push to the PR branch
        id: stage
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          FORK_REPO: ${{ steps.job.outputs.fork_repo }}
          BRANCH: ${{ steps.job.outputs.branch }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/repo"
          if git diff --quiet && git diff --cached --quiet; then
            echo "no changes produced"
            echo "outcome=nochange" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # worker 按仓库形态跑过测试（go test / pytest / npm test）。验证不过
          # 或认不出怎么验证就不推——把没验过的补丁推到别人 PR 上比不推更糟。
          python3 - <<'PY'
          import json, os, re, sys
          out = open(os.environ["RUNNER_TEMP"] + "/prfix.json", encoding="utf-8").read()
          m = re.search(r"##OSSCOUT_PRFIX##(.*)", out, re.S)
          if not m:
              sys.exit("worker produced no result marker; refusing to push")
          res = json.loads(m.group(1).strip().split("\n")[0])
          print("worker result:", {k: res.get(k) for k in
                                   ("fixed", "test_ok", "test_result")})
          if not res.get("test_ok"):
              sys.exit("tests did not pass or could not run -> refusing to push")
          PY
          git config user.name "wangshun"
          git config user.email "96341168+xixi-box@users.noreply.github.com"
          git add -A
          MSG=$(python3 - <<'PY'
          import json, os
          j = json.load(open(os.environ["RUNNER_TEMP"] + "/fix.json"))
          kind = j.get("kind") or "ci"
          subject = (("fix: address review on PR #%d" if kind == "review"
                      else "fix: address CI failures on PR #%d") % j["pr_number"])
          print(subject + "\n\n"
                "Signed-off-by: wangshun <96341168+xixi-box@users.noreply.github.com>")
          PY
          )
          git commit -q -m "$MSG"

          # 直接推 PR 分支：代码修改不需要人放行（验过的补丁就是该推的）。
          # 人只对"对外文字"负责——回复在飞书卡片里等人点发送。
          git push \
            "https://x-access-token:$GH_TOKEN@github.com/$FORK_REPO.git" \
            "HEAD:$BRANCH"
          SHA=$(git rev-parse HEAD)
          echo "pushed $SHA to $FORK_REPO@$BRANCH"
          echo "pushed_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "outcome=pushed" >> "$GITHUB_OUTPUT"

      - name: Record result for the dashboard
        if: always()
        shell: bash
        # 注意：一个 step 只能有一个 env 键。GitHub 的解析器拒绝重复键，
        # PyYAML 却静默容忍（取后者）——2026-11-04 这里的重复 env 让
        # 文件被 GitHub 判为非法，每次 push 都多一个红叉，且 review 修复
        # 的 workflow_dispatch 一起瘫痪。
        env:
          INGEST_TOKEN: ${{ secrets.CF_INGEST_TOKEN }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_PUBLIC_URL }}
          PUSHED_SHA: ${{ steps.stage.outputs.pushed_sha }}
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.request
          base = os.environ["RUNNER_TEMP"]
          j = json.load(open(base + "/fix.json"))
          try:
              out = open(base + "/prfix.json", encoding="utf-8").read()
          except OSError:
              out = ""
          m = re.search(r"##OSSCOUT_PRFIX##(.*)", out, re.S)
          res = json.loads(m.group(1).strip().split("\n")[0]) if m else {}

          # 把结果送回看板，好让飞书卡片从"进行中"变成"可发送"。
          # 失败只是状态没更新，不影响已经推送好的提交。
          payload = {"repo": j["upstream_repo"], "number": j["pr_number"],
                     "kind": j.get("kind") or "ci",
                     "test_ok": res.get("test_ok"),
                     "test_result": res.get("test_result"),
                     "changed_files": res.get("changed_files") or [],
                     "pushed": bool(res.get("changed_files")) and bool(res.get("test_ok")),
                     "pushed_sha": os.environ.get("PUSHED_SHA", ""),
                     "fork_repo": j["fork_repo"]}
          token = os.environ.get("INGEST_TOKEN", "")
          url = (os.environ.get("DASHBOARD_URL", "") or "").rstrip("/") \
              + "/api/pr/reply/fix-result"
          if not token or not url.startswith("http"):
              print("no ingest token/url; skipping callback")
              raise SystemExit(0)
          req = urllib.request.Request(
              url, data=json.dumps(payload).encode(), method="POST",
              headers={"Content-Type": "application/json",
                       "X-Ingest-Token": token})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print("callback:", r.status, r.read()[:200])
          except Exception as e:
              print("callback failed:", str(e)[:200])
          PY
          PUSHED_SHA: ${{ steps.stage.outputs.pushed_sha }}
