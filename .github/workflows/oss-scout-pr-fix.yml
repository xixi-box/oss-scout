name: oss-scout pr fix worker
run-name: ${{ inputs.job_id }}

# Prepare a verified commit and reply draft for Feishu approval.

on:
  workflow_dispatch:
    inputs:
      fix_b64:
        description: "base64(JSON): fork_repo/branch/upstream_repo/pr_number/head_sha/failing/comments"
        required: true
        type: string
      job_id:
        description: "dedup key"
        required: true
        type: string

permissions:
  contents: read

jobs:
  prfix:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Get oss-scout worker
        uses: actions/checkout@v4
        with:
          path: worker
          persist-credentials: false

      - name: Decode payload
        id: job
        shell: bash
        env:
          FIX_B64: ${{ inputs.fix_b64 }}
        run: |
          set -euo pipefail
          printf '%s' "$FIX_B64" | base64 -d > "$RUNNER_TEMP/fix.json"
          PYTHONPATH="$GITHUB_WORKSPACE/worker" python3 - <<'PY'
          import json, os, re
          from scout_v2.roster import monitored_repo
          j = json.load(open(os.environ["RUNNER_TEMP"] + "/fix.json"))
          if (not monitored_repo(j["upstream_repo"]) or
                  not re.fullmatch(r"xixi-box/[A-Za-z0-9_.-]+", j["fork_repo"]) or
                  not re.fullmatch(r"[0-9a-f]{40}", j["head_sha"])):
              raise SystemExit("PR repair target outside the monitored roster or invalid fork")
          preview = j.get("preview") is True
          if preview and ((j["upstream_repo"], j["pr_number"], j["kind"]) != ("python/cpython", 161543, "followup")
                          or type(j.get("review_id")) is not int):
              raise SystemExit("unrecognized historical review preview")
          if preview and j.get("preview_replay") is True and j.get("preview_commit") != "a10fb8582b80fa9080fa80634110c240b2cc282d":
              raise SystemExit("unrecognized historical patch")
          print("pr:", j["upstream_repo"], "#", j["pr_number"],
                "| branch:", j["branch"], "| head:", j["head_sha"][:10])
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              agent = j.get("repair_agent", "opencode")
              if agent not in ("opencode", "codex"):
                  raise SystemExit("unknown repair agent")
              f.write(f"repair_agent={agent}\n")
              f.write(f"fork_repo={j['fork_repo']}\nbranch={j['branch']}\nhead_sha={j['head_sha']}\n")
              f.write(f"preview={str(preview).lower()}\n")
              f.write(f"preview_replay={str(preview and j.get('preview_replay') is True).lower()}\n")
          PY

      - name: Checkout PR branch from fork
        shell: bash
        env:
          FORK_REPO: ${{ steps.job.outputs.fork_repo }}
          BRANCH: ${{ steps.job.outputs.branch }}
          HEAD_SHA: ${{ steps.job.outputs.head_sha }}
          PREVIEW: ${{ steps.job.outputs.preview }}
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/repo"
          git -C "$RUNNER_TEMP/repo" remote add origin "https://github.com/${FORK_REPO}.git"
          git -C "$RUNNER_TEMP/repo" fetch --depth 12 origin "refs/heads/$BRANCH"
          if [ "$PREVIEW" = true ]; then
            git -C "$RUNNER_TEMP/repo" merge-base --is-ancestor "$HEAD_SHA" FETCH_HEAD
          else
            test "$(git -C "$RUNNER_TEMP/repo" rev-parse FETCH_HEAD)" = "$HEAD_SHA"
          fi
          git -C "$RUNNER_TEMP/repo" checkout -B "$BRANCH" "$HEAD_SHA"
          echo "checked out $(git -C "$RUNNER_TEMP/repo" rev-parse HEAD)"

      - name: Install worker requirements
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages \
            -r "$GITHUB_WORKSPACE/worker/requirements.txt"
          python3 -m pip install --quiet --break-system-packages uv poetry || true

      - name: Install target repo dependencies
        shell: bash
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP/repo"
          PIP="python3 -m pip install --quiet --break-system-packages"
          if [ -f uv.lock ]; then
            uv sync --quiet || echo "WARN: uv sync failed"
          elif [ -f poetry.lock ]; then
            poetry install --quiet || echo "WARN: poetry install failed"
          elif [ -f package.json ]; then
            # npm install 静默失败 = 残缺 node_modules = 验证阶段连 runner
            # 都起不来（promptfoo#12079 第 5 轮实录）。npm ci 优先（确定性
            # 安装），失败要响——反正装不上后面必然拒推。
            if [ -f package-lock.json ]; then
              npm ci --no-audit --no-fund || echo "WARN: npm ci failed"
            else
              npm install --no-audit --no-fund || echo "WARN: npm install failed"
            fi
          elif [ -f requirements.txt ]; then
            $PIP -r requirements.txt || echo "WARN: requirements install failed"
          elif [ -f pyproject.toml ]; then
            $PIP -e . || echo "WARN: pip install -e . failed"
          fi

      - name: Install OpenCode CLI
        if: steps.job.outputs.preview_replay != 'true' && steps.job.outputs.repair_agent == 'opencode'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://opencode.ai/install | bash -s -- --no-modify-path
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          "$HOME/.opencode/bin/opencode" --version

      # 仓库有 go.mod 就装 Go：worker 用 go test 验证改动，
      # 没工具链就只能标 unverified，那样补丁推不出去。
      - name: Detect Go toolchain need
        id: go
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/repo/go.mod" ]; then
            VER=$(sed -n 's/^go \([0-9][0-9.]*\).*/\1/p' "$RUNNER_TEMP/repo/go.mod" | head -1)
            echo "needs=yes" >> "$GITHUB_OUTPUT"
            echo "version=$VER" >> "$GITHUB_OUTPUT"
            echo "go.mod wants go$VER"
          else
            echo "needs=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        if: steps.go.outputs.needs == 'yes'
        with:
          go-version: ${{ steps.go.outputs.version }}
          check-latest: true

      - name: Write opencode auth
        if: steps.job.outputs.repair_agent == 'opencode'
        shell: bash
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/opencode"
          python3 - <<'PY'
          import json, os
          p = os.path.expanduser("~/.local/share/opencode/auth.json")
          os.makedirs(os.path.dirname(p), exist_ok=True)
          with open(p, "w") as f:
              json.dump({"opencode-go": {"type": "api",
                                         "key": os.environ["OPENCODE_API_KEY"]}}, f)
          os.chmod(p, 0o600)
          PY

      - name: Install Codex CLI
        if: steps.job.outputs.preview_replay != 'true' && steps.job.outputs.repair_agent == 'codex'
        run: |
          npm install -g @openai/codex@0.167.1
          codex --version

      - name: Collect PR evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE/worker"
          python3 -m scout_v2.workers.pr_fix --collect-context \
            --fix "$RUNNER_TEMP/fix.json" --repo-dir "$RUNNER_TEMP/repo" \
            --context "$RUNNER_TEMP/pr-context.json"

      - name: Prepare fix and reply
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          CF_INGEST_TOKEN: ${{ secrets.CF_INGEST_TOKEN }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_PUBLIC_URL }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/worker"
          python3 -m scout_v2.workers.pr_fix --fix "$RUNNER_TEMP/fix.json" \
            --repo-dir "$RUNNER_TEMP/repo" --context "$RUNNER_TEMP/pr-context.json" \
            --decision "$RUNNER_TEMP/pr-decision.json" > "$RUNNER_TEMP/prfix.json"

      - name: Save tested commit without pushing
        id: stage
        env:
          HEAD_SHA: ${{ steps.job.outputs.head_sha }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/repo"
          python3 - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, os.environ["GITHUB_WORKSPACE"] + "/worker")
          from scout_v2.workers.commit_identity import commit_as_owner
          tmp = Path(os.environ["RUNNER_TEMP"])
          result = next(line.split("##OSSCOUT_PRFIX##", 1)[1]
                        for line in (tmp / "prfix.json").read_text().splitlines()
                        if line.startswith("##OSSCOUT_PRFIX##"))
          result = json.loads(result)
          print("Verification:", result.get("test_result") or result.get("skipped") or "unavailable")
          if not result.get("fixed"):
              raise SystemExit(0)
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          head = os.environ["HEAD_SHA"]
          if git("rev-parse", "HEAD") != head:
              raise SystemExit("worker changed HEAD before staging")
          job = json.loads((tmp / "fix.json").read_text())
          git("add", "-A")
          if git("write-tree") != result["tested_tree"]:
              raise SystemExit("staged patch does not match the tested tree")
          commit_as_owner(Path.cwd(), f"fix: follow up on PR #{job['pr_number']}").check_returncode()
          git("update-ref", "refs/heads/oss-scout-approval", "HEAD")
          git("bundle", "create", str(tmp / "pr-fix.bundle"), "refs/heads/oss-scout-approval", f"^{head}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"commit_sha={git('rev-parse', 'HEAD')}\n")
          PY

      - name: Deliver approval candidate to dashboard
        if: always() && steps.job.outcome == 'success'
        env:
          INGEST_TOKEN: ${{ secrets.CF_INGEST_TOKEN }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_PUBLIC_URL }}
          JOB_ID: ${{ inputs.job_id }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ steps.stage.outputs.commit_sha }}
        run: |
          python3 - <<'PY'
          import base64, json, os, time, urllib.request
          from pathlib import Path
          tmp = Path(os.environ["RUNNER_TEMP"])
          job = json.loads((tmp / "fix.json").read_text())
          output = tmp / "prfix.json"
          lines = output.read_text().splitlines() if output.exists() else []
          marker = next((line.split("##OSSCOUT_PRFIX##", 1)[1] for line in lines
                         if line.startswith("##OSSCOUT_PRFIX##")), "{}")
          result = json.loads(marker)
          context_file = tmp / "pr-context.json"
          context = json.loads(context_file.read_text()) if context_file.exists() else {}
          sha = os.environ["COMMIT_SHA"]
          preview = job.get("preview") is True
          responses = (result.get("responses") or []) if sha or not result.get("fixed") else []
          if preview and job.get("preview_verify_only") is True:
              if not responses:
                  raise SystemExit("review verification did not produce a result")
              print(f"Verified {len(responses)} review decisions and staged commit {sha or '(none)'}")
              raise SystemExit(0)
          if preview and not responses:
              responses = [
                  {"id": key, "source": item["source"], "thread_id": item["thread_id"],
                   **{field: item.get(field) for field in
                      ("url", "author", "body", "path", "line", "start_line", "original_line", "original_start_line")},
                   "action": "unavailable", "draft": ""}
                  for key, item in (context.get("targets") or {}).items()
              ]
          bundle = tmp / "pr-fix.bundle"
          if sha and bundle.stat().st_size > 6 * 1024 * 1024:
              raise SystemExit("approval bundle exceeds 6 MiB")
          payload = {
              **{k: job.get(k) for k in ("branch", "head_sha", "fork_repo", "kind")},
              "repo": job["upstream_repo"], "number": job["pr_number"],
              "job_id": os.environ["JOB_ID"], "run_id": os.environ["RUN_ID"],
              "commit_sha": sha,
              "bundle": base64.b64encode(bundle.read_bytes()).decode() if sha and not preview else "",
              "preview": preview,
              "review_id": job.get("review_id"),
              "test_result": result.get("test_result") or result.get("skipped") or "workflow failed",
              "verification_failed": result.get("verification_failed") is True,
              "changed_files": result.get("changed_files") or [],
              "reply": (result.get("reply") or "") if sha or not result.get("fixed") else "",
              "responses": responses,
              "summary": result.get("summary") or "", "trigger": context.get("trigger"),
              "title": (context.get("pr") or {}).get("title", ""),
          }
          req = urllib.request.Request(
              os.environ["DASHBOARD_URL"].rstrip("/") + "/api/pr/reply/fix-result",
              data=json.dumps(payload).encode(), method="POST",
              headers={"Content-Type": "application/json", "X-Ingest-Token": os.environ["INGEST_TOKEN"]})
          for attempt in range(3):
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      print("approval result delivered:", response.status)
                  break
              except OSError:
                  if attempt == 2:
                      raise
                  time.sleep(5 * (attempt + 1))
          PY

      - name: Upload redacted agent diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pr-fix-diagnostics-${{ inputs.job_id }}
          path: ${{ runner.temp }}/artifacts/
          retention-days: 1
          if-no-files-found: ignore
