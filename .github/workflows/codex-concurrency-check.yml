name: Codex serialized session check
on:
  workflow_dispatch:
    inputs:
      model:
        description: Model and effort for two serialized self-test requests
        type: string
        default: gpt-6.1-sol#medium
      refresh:
        description: Exercise a native CLI refresh once, with serialized writeback
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    environment: codex-auth
    concurrency:
      group: codex-account-session
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm install -g @openai/codex@0.167.1
      - name: Restore Codex subscription credentials
        id: codex_auth
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python scripts/codex_secret_session.py restore
      - name: Verify repair and review share the native login
        env:
          CHECK_MODEL: ${{ inputs.model }}
          CHECK_REFRESH: ${{ inputs.refresh }}
          OSSCOUT_CODEX_AUTH_MODE: github_secrets
          OSSCOUT_CODEX_AUTH_FILE: ${{ runner.temp }}/oss-codex-auth/auth.json
        run: python scripts/verify_codex_session.py
      - name: Persist refreshed Codex subscription credentials
        if: always() && steps.codex_auth.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python scripts/codex_secret_session.py persist
      - name: Remove private Codex login files
        if: always()
        run: python scripts/codex_secret_session.py cleanup
