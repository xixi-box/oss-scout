name: bh inspect
on:
  workflow_dispatch:
jobs:
  c:
    runs-on: [self-hosted, aliyun]
    steps:
      - run: |
          docker exec oss-scout python -c "
import json, glob
for f in sorted(glob.glob('/data/state/bughunt/*/*/findings.json')):
    d = json.load(open(f))
    repo = d.get('repo', '?')
    findings = d.get('findings') or []
    if not findings:
        continue
    print(f'=== {repo} ({len(findings)}) ===')
    for x in findings[:4]:
        kind = x.get('rule_id', '?')
        msg = x.get('message', '')[:110]
        print(f'  [{kind}] {x.get(\"path\",\"?\")}:{x.get(\"line\",0)}')
        print(f'    {msg}')
"
