name: cap check
on:
  workflow_dispatch:
jobs:
  c:
    runs-on: [self-hosted, aliyun]
    steps:
      - name: claims and today's pipeline runs
        run: |
          docker exec oss-scout sh -c '
            echo "=== claim_days (all) ==="
            python3 -c "
import sqlite3
c = sqlite3.connect(\"/data/state/scout_v2.sqlite3\")
for row in c.execute(\"SELECT day, candidate_id, action, ts FROM claim_days ORDER BY ts DESC LIMIT 15\"):
    print(\"  \", row)
"
            echo "=== configured cap ==="
            grep max_new_claims /data/configs/repositories.yaml
          '
