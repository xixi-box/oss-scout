name: oss-scout repair worker

# 由 oss-scout 控制器（VPS）workflow_dispatch 调用，在本仓库的托管 runner 上执行
# repair：clone **目标仓库**到 base_sha → 按目标仓库自己的依赖跑测试 → opencode
# 产出补丁 → 干净 base 上重放补丁再跑测试。
#
# 为什么用托管 runner 而不是自建沙箱（2026-10-28 重构）：
#   opencode CLI 是交互式 TUI 工具，在无 tty 的瘦容器里会卡在 bootstrap
#   （插件安装 / 权限询问 / models 端点探测，见上游 #44684 #14473 #47282 #44782）。
#   GitHub 托管 runner 有完整的用户态、稳定网络、平台级超时与日志留存，
#   目标仓库的依赖/测试框架也按它自己的方式装，证据链才可信。
#
# 安全边界：contents: read。本 job 不持有 GitHub 写权限，产出 patch + test report
# 走 artifact 回传，由控制器（唯一的写者）决定是否 push 分支、开 PR。

on:
  workflow_dispatch:
    inputs:
      oss_job_b64:
        description: "base64(JSON) job payload (target_repo/base_sha/mode/test_cmd/model/ai_test_files)"
        required: true
        type: string
      job_id:
        description: "job id (used in the artifact name)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    # 90 分钟：agent 最多 20 分钟 + base/patched 两轮测试各最多 30 分钟，
    # 再加装依赖与编译（Rust 项目首次 cargo build 就 10 分钟以上）。
    # 原来的 40 分钟会在验证中途把 run 杀掉，前面全白做。
    timeout-minutes: 90
    steps:
      - name: Decode job payload
        id: job
        shell: bash
        env:
          OSS_JOB_B64: ${{ inputs.oss_job_b64 }}
        run: |
          set -euo pipefail
          printf '%s' "$OSS_JOB_B64" | base64 -d > "$RUNNER_TEMP/job.json"
          python3 - <<'PY'
          import json, os
          j = json.load(open(os.environ["RUNNER_TEMP"] + "/job.json"))
          print("mode:", j["mode"], "repo:", j["repo"], "sha:", j["base_sha"][:12])
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"target_repo={j['repo']}\n")
              f.write(f"base_sha={j['base_sha']}\n")
          PY

      - name: Checkout target repo at base_sha
        shell: bash
        env:
          TARGET_REPO: ${{ steps.job.outputs.target_repo }}
          BASE_SHA: ${{ steps.job.outputs.base_sha }}
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/repo"
          git -C "$RUNNER_TEMP/repo" remote add origin "https://github.com/${TARGET_REPO}.git"
          git -C "$RUNNER_TEMP/repo" fetch --depth 1 origin "$BASE_SHA"
          git -C "$RUNNER_TEMP/repo" checkout --detach FETCH_HEAD
          echo "checked out $(git -C "$RUNNER_TEMP/repo" rev-parse HEAD)"

      - name: Get oss-scout worker
        # oss-scout 是私有仓库，匿名 https clone 会 "could not read Username" (rc=128)。
        # actions/checkout 用内置 GITHUB_TOKEN 拉取本次 commit 的 worker 源码。
        # 注意：checkout 的 path 必须在 workspace 内，传 $RUNNER_TEMP 会被拒绝
        # （"Repository path ... is not under ..."），因此落到 workspace 下的 worker/。
        uses: actions/checkout@v4
        with:
          path: worker

      - name: Install worker requirements
        shell: bash
        # 装到系统 site-packages：worker 跑测试时会把 HOME 重定向到临时沙箱目录，
        # --user 装进 ~/.local 的包在重定向后就找不到了（2026-10-28 实测：
        # base 与 patched 都以 "No module named pytest" rc=1 结束）。
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages \
            -r "$GITHUB_WORKSPACE/worker/requirements.txt"
          python3 -c "import pytest, yaml; print('worker deps ok', pytest.__version__)"

      - name: Install target repo dependencies
        shell: bash
        # 目标仓库的依赖由 agent 自己装（它有 shell、会读项目文档、知道 workspace
        # 布局）。这里只做两件事：给出常用包管理器，以及在根目录确实有清单时
        # 提前装好省它一点时间。
        #
        # 2026-10-30 实测教训：langchain 这类 monorepo 的 uv.lock 在
        # libs/partners/<pkg>/ 下，根目录一个清单都没有。旧版脚本据此打印
        # "no Python dependency manifest" 就结束，**一个依赖都没装**，而日志
        # 看起来像成功。agent 只好自己现场装，装完的环境又和验证阶段对不上。
        run: |
          set -uo pipefail
          # 预置常用工具，让 agent 不必每个都现装
          python3 -m pip install --quiet --break-system-packages uv poetry || true
          cd "$RUNNER_TEMP/repo"
          PIP="python3 -m pip install --quiet --break-system-packages"
          if [ -f uv.lock ]; then
            uv sync --quiet || echo "WARN: uv sync failed"
          elif [ -f poetry.lock ]; then
            poetry install --quiet || echo "WARN: poetry install failed"
          elif [ -f package.json ]; then
            (command -v npm >/dev/null && npm install --silent) || echo "WARN: npm install failed"
          elif [ -f requirements.txt ]; then
            $PIP -r requirements.txt || echo "WARN: requirements install failed"
          elif [ -f pyproject.toml ]; then
            $PIP -e . || echo "WARN: pip install -e . failed"
          else
            echo "no root manifest; the agent will resolve dependencies itself"
            # 提示 agent 常见布局，避免它在大仓库里瞎找
            find . -maxdepth 3 \( -name uv.lock -o -name poetry.lock \
                 -o -name requirements.txt -o -name package.json \
                 -o -name Cargo.toml \) -not -path "*/node_modules/*" 2>/dev/null | head -20
          fi

      - name: Install OpenCode CLI
        shell: bash
        # runner 上 opencode 装到 ~/.opencode/bin；用 --no-modify-path 避免改 shell 配置。
        # 不用 `|| true`：装不上就让 job 明确失败，而不是跑到一半报奇怪的错。
        run: |
          set -euo pipefail
          curl -fsSL https://opencode.ai/install | bash -s -- --no-modify-path
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          "$HOME/.opencode/bin/opencode" --version

      - name: Write opencode auth
        shell: bash
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/opencode"
          python3 - <<'PY'
          import json, os
          p = os.path.expanduser("~/.local/share/opencode/auth.json")
          os.makedirs(os.path.dirname(p), exist_ok=True)
          with open(p, "w") as f:
              json.dump({"opencode-go": {"type": "api",
                                         "key": os.environ["OPENCODE_API_KEY"]}}, f)
          os.chmod(p, 0o600)
          PY

      - name: Run worker
        shell: bash
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/worker"
          PYTHONPATH="$GITHUB_WORKSPACE/worker" python3 -m scout_v2.workers.core \
            --job "$RUNNER_TEMP/job.json" \
            --out "$RUNNER_TEMP/artifacts" \
            --repo-dir "$RUNNER_TEMP/repo" \
            --backend github_actions \
            --emit-envelope

      - name: Publish (push branch + open PR)
        # 只有 job payload 里显式带了 publish 配置才执行，且必须在 worker 自证
        # 通过之后（outcome=succeeded + patch 存在）。写权限只在这一步出现。
        # 放在 runner 上而非 VPS：VPS 到 github.com 只有一条代理线路，断几分钟
        # 就会让已验证的修复作废（2026-10-28 实录）。
        #
        # 用 PAT（GH_TOKEN）而不是内置 GITHUB_TOKEN：内置令牌只能访问本仓库，
        # 推不了 fork（xixi-box/<upstream>），也开不了上游仓库的 PR。
        id: publish
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/worker"
          PYTHONPATH="$GITHUB_WORKSPACE/worker" python3 - <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, os.environ["GITHUB_WORKSPACE"] + "/worker")
          from scout_v2.workers.publish_remote import publish_from_env

          tmp = pathlib.Path(os.environ["RUNNER_TEMP"])
          job = json.loads((tmp / "job.json").read_text())
          if not (job.get("publish") or {}):
              print("no publish config in payload; skipping")
              sys.exit(0)

          res_file = tmp / "artifacts" / "result.json"
          if not res_file.is_file():
              print("no result.json; refusing to publish"); sys.exit(0)
          res = json.loads(res_file.read_text())
          ok = (res.get("outcome") == "succeeded"
                and res.get("reproduced_on_base") and res.get("fixed_on_patch"))
          if not ok:
              print(f"evidence chain not satisfied ({res.get('outcome')}); refusing to publish")
              sys.exit(0)

          out = publish_from_env(job, tmp / "repo", tmp / "artifacts")
          if out and not out.get("ok"):
              print(f"publish failed: {out.get('error')}")
              sys.exit(1)
          PY

      - name: Upload artifacts
        # artifact 存储有账号级配额，撞上时整包丢失（2026-10-28 实录）。
        # 因此 result/patch 的主通道是 stdout 信封（后端优先读 artifact，
        # 读不到会回退解析日志）。artifact 只是有额度时的便利备份，失败不致命。
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: oss-result-${{ inputs.job_id }}
          path: ${{ runner.temp }}/artifacts/
          retention-days: 1
          if-no-files-found: warn
