name: oss-scout repair worker
run-name: repair ${{ inputs.job_id }}

# 由 oss-scout 控制器（VPS）workflow_dispatch 调用，在本仓库的托管 runner 上执行
# repair：checkout 目标 base → OpenCode/Codex 自主修复、测试、自查
# → 收集完整补丁与日志 → 机械发布检查 → 可信步骤创建 PR。
#
# 为什么用托管 runner 而不是自建沙箱（2026-10-28 重构）：
#   opencode CLI 是交互式 TUI 工具，在无 tty 的瘦容器里会卡在 bootstrap
#   （插件安装 / 权限询问 / models 端点探测，见上游 #44684 #14473 #47282 #44782）。
#   GitHub 托管 runner 有完整的用户态、稳定网络、平台级超时与日志留存，
#   目标仓库的依赖/测试框架由 Agent 自主准备，完整日志留存。
#
# 安全边界：Agent 步骤无 GitHub 写凭据；发布和凭据回存仅在可信步骤使用 PAT。

on:
  workflow_dispatch:
    inputs:
      oss_job_b64:
        description: "base64(JSON) job payload (target_repo/base_sha/mode/test_cmd/model/ai_test_files)"
        required: true
        type: string
      job_id:
        description: "job id (used in the artifact name)"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  repair:
    environment: codex-auth
    concurrency:
      group: codex-account-session
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Agent 总预算 40 分钟；工作流额外预留安装工具、发布、凭据回存与上传时间。
    timeout-minutes: 90
    steps:
      - name: Decode job payload
        id: job
        shell: bash
        env:
          OSS_JOB_B64: ${{ inputs.oss_job_b64 }}
        run: |
          set -euo pipefail
          printf '%s' "$OSS_JOB_B64" | base64 -d > "$RUNNER_TEMP/job.json"
          python3 - <<'PY'
          import json, os
          j = json.load(open(os.environ["RUNNER_TEMP"] + "/job.json"))
          print("mode:", j["mode"], "repo:", j["repo"], "sha:", j["base_sha"][:12])
          agent = j.get("repair_agent", "opencode")
          if agent not in ("opencode", "codex"):
              raise SystemExit("unknown repair agent")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"repair_agent={agent}\n")
              f.write(f"target_repo={j['repo']}\n")
              f.write(f"base_sha={j['base_sha']}\n")
          PY

      - name: Checkout target repo at base_sha
        shell: bash
        env:
          TARGET_REPO: ${{ steps.job.outputs.target_repo }}
          BASE_SHA: ${{ steps.job.outputs.base_sha }}
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/repo"
          git -C "$RUNNER_TEMP/repo" remote add origin "https://github.com/${TARGET_REPO}.git"
          git -C "$RUNNER_TEMP/repo" fetch --depth 1 origin "$BASE_SHA"
          git -C "$RUNNER_TEMP/repo" checkout --detach FETCH_HEAD
          echo "checked out $(git -C "$RUNNER_TEMP/repo" rev-parse HEAD)"

      - name: Get oss-scout worker
        # oss-scout 是私有仓库，匿名 https clone 会 "could not read Username" (rc=128)。
        # actions/checkout 用内置 GITHUB_TOKEN 拉取本次 commit 的 worker 源码。
        # 注意：checkout 的 path 必须在 workspace 内，传 $RUNNER_TEMP 会被拒绝
        # （"Repository path ... is not under ..."），因此落到 workspace 下的 worker/。
        uses: actions/checkout@v4
        with:
          path: worker
          persist-credentials: false

      - name: Install worker requirements
        shell: bash
        # 装到系统 site-packages：worker 跑测试时会把 HOME 重定向到临时沙箱目录，
        # --user 装进 ~/.local 的包在重定向后就找不到了（2026-10-28 实测：
        # base 与 patched 都以 "No module named pytest" rc=1 结束）。
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages \
            -r "$GITHUB_WORKSPACE/worker/requirements.txt"
          python3 -c "import pytest, yaml; print('worker deps ok', pytest.__version__)"

      - name: Load screened issue snapshot
        id: context
        env:
          INGEST_TOKEN: ${{ secrets.CF_INGEST_TOKEN }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_PUBLIC_URL }}
        run: |
          cd "$GITHUB_WORKSPACE/worker"
          python3 -m scout_v2.workers.issue_context

      - name: Download retained delivery
        id: recovery
        if: steps.context.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE/worker"
          python3 -m scout_v2.workers.delivery_recovery --job "$RUNNER_TEMP/job.json" --destination "$RUNNER_TEMP/verified-input"

      - name: Preflight publication
        if: steps.context.outputs.ready == 'true' && steps.recovery.outputs.ready == 'true'
        id: preflight
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE/worker"
          python3 - <<'PY'
          import json, os, pathlib
          from scout_v2.schemas import Result
          from scout_v2.workers.core import emit_envelope
          from scout_v2.workers.publication_guard import refresh_publication_evidence
          tmp = pathlib.Path(os.environ['RUNNER_TEMP'])
          job = json.loads((tmp / 'job.json').read_text())
          evidence = refresh_publication_evidence(job, job['publish']) if job.get('publish') else {'ok':True}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('can_repair=' + str(bool(evidence.get('ok'))).lower() + '\n')
          if not evidence.get('ok'):
              out = tmp / 'artifacts'
              out.mkdir(exist_ok=True)
              result = Result(job_id=job['job_id'], backend='github_actions', outcome='blocked',
                              base_sha=job['base_sha'], unverified_items=[evidence.get('error') or 'publication unavailable'])
              (out / 'result.json').write_text(json.dumps(result.to_dict()))
              publication = {key:evidence.get(key) for key in ('ok','error','failure_kind','coarse_reason')}
              (out / 'publish.json').write_text(json.dumps(publication, ensure_ascii=False))
              (out / 'publication-evidence.json').write_text(json.dumps(evidence, ensure_ascii=False))
              emit_envelope(result, out)
              print('##OSSCOUT_PUBLISH##' + json.dumps(publication, ensure_ascii=False))
          PY

      - name: Identify Agent package cache
        id: dependency_cache
        if: steps.preflight.outputs.can_repair == 'true'
        env:
          TARGET_REPO: ${{ steps.job.outputs.target_repo }}
        shell: bash
        run: |
          set -euo pipefail
          scope=$(printf '%s' "${TARGET_REPO,,}" | sha256sum | cut -c1-20)
          fingerprint=$(git -C "$RUNNER_TEMP/repo" ls-files -s -- \
            ':(glob)**/uv.lock' ':(glob)**/poetry.lock' ':(glob)**/pyproject.toml' \
            ':(glob)**/requirements*.txt' ':(glob)**/package.json' \
            ':(glob)**/package-lock.json' ':(glob)**/npm-shrinkwrap.json' \
            ':(glob)**/pnpm-lock.yaml' ':(glob)**/yarn.lock' \
            | sha256sum | cut -c1-24)
          prefix="repair-packages-v1-${RUNNER_OS}-${RUNNER_ARCH}-${ImageOS:-ubuntu}-${scope}-"
          printf 'prefix=%s\nkey=%s%s\n' "$prefix" "$prefix" "$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Restore Agent package cache
        id: restore_packages
        if: steps.preflight.outputs.can_repair == 'true'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/oss-package-cache/uv
            ${{ runner.temp }}/oss-package-cache/pip
            ${{ runner.temp }}/oss-package-cache/npm/_cacache
          key: ${{ steps.dependency_cache.outputs.key }}
          restore-keys: ${{ steps.dependency_cache.outputs.prefix }}

      - name: Prepare common Agent tools
        if: steps.preflight.outputs.can_repair == 'true'
        run: |
          set -euo pipefail
          if ! command -v uv >/dev/null; then
            started=$SECONDS
            python3 -m pip install --quiet --break-system-packages uv || echo "WARN: optional package manager bootstrap failed"
            echo "Package manager bootstrap: $((SECONDS - started))s"
          fi

      - name: Install OpenCode CLI
        if: steps.preflight.outputs.can_repair == 'true' && steps.job.outputs.repair_agent == 'opencode'
        shell: bash
        # runner 上 opencode 装到 ~/.opencode/bin；用 --no-modify-path 避免改 shell 配置。
        # 不用 `|| true`：装不上就让 job 明确失败，而不是跑到一半报奇怪的错。
        run: |
          set -euo pipefail
          curl -fsSL https://opencode.ai/install | bash -s -- --no-modify-path
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          "$HOME/.opencode/bin/opencode" --version

      - name: Write opencode auth
        if: steps.preflight.outputs.can_repair == 'true' && steps.job.outputs.repair_agent == 'opencode'
        shell: bash
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/opencode"
          python3 - <<'PY'
          import json, os
          p = os.path.expanduser("~/.local/share/opencode/auth.json")
          os.makedirs(os.path.dirname(p), exist_ok=True)
          with open(p, "w") as f:
              json.dump({"opencode-go": {"type": "api",
                                         "key": os.environ["OPENCODE_API_KEY"]}}, f)
          os.chmod(p, 0o600)
          PY

      - name: Install Codex CLI
        if: steps.preflight.outputs.can_repair == 'true' && steps.job.outputs.repair_agent == 'codex'
        run: |
          npm install -g @openai/codex@0.167.1
          codex --version

      - name: Restore Codex subscription credentials
        id: codex_auth
        if: steps.preflight.outputs.can_repair == 'true' && steps.job.outputs.repair_agent == 'codex'
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python3 "$GITHUB_WORKSPACE/worker/scripts/codex_secret_session.py" restore

      - name: Run worker
        if: steps.preflight.outputs.can_repair == 'true'
        shell: bash
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/oss-package-cache/uv
          UV_LINK_MODE: copy
          PIP_CACHE_DIR: ${{ runner.temp }}/oss-package-cache/pip
          npm_config_cache: ${{ runner.temp }}/oss-package-cache/npm
          OSSCOUT_DEPENDENCY_TIMING: ${{ runner.temp }}/artifacts/dependency-install.log
          CACHE_EXACT: ${{ steps.restore_packages.outputs.cache-hit }}
          CACHE_RESTORE_OUTCOME: ${{ steps.restore_packages.outcome }}
          CACHE_MATCHED: ${{ steps.restore_packages.outputs.cache-matched-key }}
          OSSCOUT_VERIFIED_DELIVERY_DIR: ${{ runner.temp }}/verified-input
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OSSCOUT_CODEX_AUTH_MODE: github_secrets
          OSSCOUT_CODEX_AUTH_FILE: ${{ runner.temp }}/oss-codex-auth/auth.json
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/worker"
          mkdir -p "$RUNNER_TEMP/artifacts" "$RUNNER_TEMP/oss-install-shims"
          mkdir -p "$UV_CACHE_DIR" "$PIP_CACHE_DIR" "$npm_config_cache"
          cache_status=miss
          if [ "$CACHE_EXACT" = true ]; then cache_status=exact
          elif [ -n "$CACHE_MATCHED" ]; then cache_status=fallback
          elif [ "$CACHE_RESTORE_OUTCOME" = failure ]; then cache_status=unavailable; fi
          printf 'dependency_cache=%s\n' "$cache_status" | tee "$OSSCOUT_DEPENDENCY_TIMING"
          install -m 0755 scripts/measure_repair_install.sh "$RUNNER_TEMP/oss-install-shims/measure"
          for tool in uv npm pip pip3 python python3; do
            if command -v "$tool" >/dev/null; then
              ln -s measure "$RUNNER_TEMP/oss-install-shims/$tool"
            fi
          done
          trap 'cat "$OSSCOUT_DEPENDENCY_TIMING"' EXIT
          PATH="$RUNNER_TEMP/oss-install-shims:$PATH" PYTHONPATH="$GITHUB_WORKSPACE/worker" python3 -m scout_v2.workers.core \
            --job "$RUNNER_TEMP/job.json" \
            --out "$RUNNER_TEMP/artifacts" \
            --repo-dir "$RUNNER_TEMP/repo" \
            --backend github_actions \
            --emit-envelope

      - name: Refresh publication evidence
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE/worker"
          python3 - <<'PY'
          import json, os, pathlib
          from scout_v2.workers.publication_guard import refresh_publication_evidence
          tmp = pathlib.Path(os.environ['RUNNER_TEMP'])
          job = json.loads((tmp / 'job.json').read_text())
          result = json.loads((tmp / 'artifacts/result.json').read_text())
          if result.get('outcome') == 'succeeded' and job.get('publish'):
              evidence = refresh_publication_evidence(job, job['publish'])
              (tmp / 'artifacts/publication-evidence.json').write_text(json.dumps(evidence, ensure_ascii=False))
              print('publication preflight:', evidence.get('ok'), evidence.get('failure_kind'))
          PY

      - name: Persist refreshed Codex subscription credentials
        if: always() && steps.codex_auth.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python3 "$GITHUB_WORKSPACE/worker/scripts/codex_secret_session.py" persist

      - name: Save Agent package cache
        if: ${{ !cancelled() && steps.dependency_cache.outputs.key != '' && steps.restore_packages.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/oss-package-cache/uv
            ${{ runner.temp }}/oss-package-cache/pip
            ${{ runner.temp }}/oss-package-cache/npm/_cacache
          key: ${{ steps.dependency_cache.outputs.key }}

      - name: Publish (push branch + open PR)
        # 只有 job payload 里显式带了 publish 配置才执行，且必须在 worker 自证
        # 通过之后（outcome=succeeded + patch 存在）。写权限只在这一步出现。
        # 放在 runner 上而非 VPS：VPS 到 github.com 只有一条代理线路，断几分钟
        # 就会让已验证的修复作废（2026-10-28 实录）。
        #
        # 用 PAT（GH_TOKEN）而不是内置 GITHUB_TOKEN：内置令牌只能访问本仓库，
        # 推不了 fork（xixi-box/<upstream>），也开不了上游仓库的 PR。
        id: publish
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/worker"
          PYTHONPATH="$GITHUB_WORKSPACE/worker" python3 - <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, os.environ["GITHUB_WORKSPACE"] + "/worker")
          from scout_v2.workers.publish_remote import publish_from_env
          from scout_v2.schemas import Job, Result
          from scout_v2.workers.quality_gate import verify_result

          tmp = pathlib.Path(os.environ["RUNNER_TEMP"])
          job = json.loads((tmp / "job.json").read_text())
          if os.environ.get("GITHUB_RUN_ATTEMPT", "1") != "1":
              print("publication requires a new controller reservation; skipping rerun")
              sys.exit(0)
          if not (job.get("publish") or {}):
              print("no publish config in payload; skipping")
              sys.exit(0)

          res_file = tmp / "artifacts" / "result.json"
          if not res_file.is_file():
              print("no result.json; refusing to publish"); sys.exit(0)
          res = json.loads(res_file.read_text())
          report = verify_result(Result.from_dict(res), Job.from_dict(job),
                                 expected_base_sha=job["base_sha"])
          ok = (res.get("outcome") == "succeeded"
                and report.ok)
          if not ok:
              print(f"mechanical result checks failed ({res.get('outcome')}, {report.errors}); refusing to publish")
              sys.exit(0)

          out = publish_from_env(job, tmp / "repo", tmp / "artifacts")
          if out and not out.get("ok"):
              print(f"publish failed: {out.get('error')}")
              sys.exit(1)
          PY

      - name: Preserve verified delivery
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE/worker"
          python3 - <<'PY'
          import json, os, pathlib
          from scout_v2.workers.publication_guard import preserve_verified_bundle
          tmp = pathlib.Path(os.environ['RUNNER_TEMP'])
          out = tmp / 'artifacts'
          if (out / 'result.json').exists():
              result = json.loads((out / 'result.json').read_text())
              if result.get('outcome') == 'succeeded':
                  job = json.loads((tmp / 'job.json').read_text())
                  publication = json.loads((out / 'publish.json').read_text()) if (out / 'publish.json').exists() else {'ok':False, 'error':'publication not attempted'}
                  saved = preserve_verified_bundle(job, out, publication)
                  print('verified delivery preserved:', saved.get('ok'), saved.get('error', ''))
                  if not saved.get('ok'):
                      raise SystemExit(1)
          PY

      - name: Upload verified delivery
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: oss-verified-${{ inputs.job_id }}
          path: ${{ runner.temp }}/artifacts/verified-delivery/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload artifacts
        # artifact 存储有账号级配额，撞上时整包丢失（2026-10-28 实录）。
        # 因此 result/patch 的主通道是 stdout 信封（后端优先读 artifact，
        # 读不到会回退解析日志）。artifact 只是有额度时的便利备份，失败不致命。
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: oss-result-${{ inputs.job_id }}
          path: ${{ runner.temp }}/artifacts/
          retention-days: 1
          if-no-files-found: warn

      - name: Remove private Codex login files
        if: always()
        run: python3 "$GITHUB_WORKSPACE/worker/scripts/codex_secret_session.py" cleanup
