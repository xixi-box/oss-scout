name: bug hunter trial
on:
  workflow_dispatch:
    inputs:
      repos:
        description: How many MVP repos to scan
        default: "3"
jobs:
  t:
    runs-on: [self-hosted, aliyun]
    steps:
      - name: Scan
        shell: bash
        run: |
          set -uo pipefail
          docker exec oss-scout python /app/scripts/p6_bug_hunter.py --yes \
            --repos "${{ inputs.repos }}" 2>&1 | tail -60
      - name: Findings summary
        if: always()
        shell: bash
        run: |
          docker exec oss-scout python /app/scripts/bh_summary.py 2>&1 || true
