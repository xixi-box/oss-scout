name: Diagnose oss-scout container
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: [self-hosted, aliyun]
    steps:
      - name: Container state and logs
        run: |
          docker ps -a --filter name=oss-scout --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          echo "=== logs (last 50) ==="
          docker logs --tail 50 oss-scout 2>&1 || echo "no logs"
          echo "=== curl from host ==="
          curl -sv --max-time 5 http://127.0.0.1:18787/login 2>&1 | tail -8 || true

      - name: Credential wiring
        # 仓库公开后 token 从文件移到了 secrets（CF_API_TOKEN / CF_INGEST_TOKEN）。
        # 脚本只打印"有没有"，不打印值。
        run: docker exec oss-scout python /app/scripts/container_diag.py

      - name: Overnight activity probe
        run: docker exec -i oss-scout python3 /app/scripts/overnight_probe.py

      - name: Drain diagnosis
        run: docker exec -i oss-scout python3 /app/scripts/drain_probe.py

      - name: Quota and queue consumption
        run: docker exec -i oss-scout python3 /app/scripts/quota_probe.py

      - name: Queue composition (new by repo)
        run: |
          docker exec -i oss-scout python3 - <<'PY'
          import json, collections, os
          from pathlib import Path
          root = Path(os.environ.get("OSSCOUT_DASHBOARD_ROOT", "/data"))
          q = json.loads((root / "queue" / "candidates.json")
                         .read_text(encoding="utf-8"))
          by = collections.Counter()
          for k, v in q.items():
              if isinstance(v, dict) and v.get("status") == "new":
                  by[str(k).rsplit("#", 1)[0]] += 1
          print("new total:", sum(by.values()))
          for repo, n in by.most_common(40):
              print(" ", repo, n)
          st = collections.Counter(str((v or {}).get("status"))
                                   for v in q.values() if isinstance(v, dict))
          print("all statuses:", dict(st))
          PY

      - name: Restore wrongly-kicked candidates (one-time)
        run: |
          docker exec -i oss-scout python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ.get("OSSCOUT_DASHBOARD_ROOT", "/data"))
          qpath = root / "queue" / "candidates.json"
          q = json.loads(qpath.read_text(encoding="utf-8"))
          # 2026-11-06 一次性恢复：昨天的 Kick 步骤把 409 条候选（含 49 条
          # 正常排队的 new）误标 stage_expired，清空了消费队列。全部恢复
          # 为 new，让 drain 按老→新顺序逐条消费；真正过期的会在认领前
          # 复检和修复失败中被自然淘汰。
          restored = 0
          for key, e in q.items():
              e = e or {}
              if e.get("status") == "stage_expired":
                  e["status"] = "new"
                  restored += 1
          tmp = qpath.with_suffix(".json.tmp")
          tmp.write_text(json.dumps(q, ensure_ascii=False, indent=1),
                         encoding="utf-8")
          json.loads(tmp.read_text(encoding="utf-8"))
          os.replace(tmp, qpath)
          print(f"restored {restored} candidates to new")
          PY

      - name: Purge too_fresh (age gate retired)
        run: docker exec -i oss-scout python3 /app/scripts/purge_too_fresh.py

      - name: Live state dump (read-only)
        run: |
          docker exec -i oss-scout python3 - <<'PY'
          import json, collections
          from pathlib import Path
          root = Path("/data")

          def tail(path, n=12, contains=None):
              try:
                  lines = Path(path).read_text(encoding="utf-8",
                                               errors="replace").splitlines()
              except OSError:
                  return []
              if contains:
                  lines = [l for l in lines if contains in l]
              return lines[-n:]

          print("=== seen.json freshness ===")
          try:
              seen = json.loads((root / "state" / "seen.json")
                                .read_text(encoding="utf-8"))
              firsts = sorted((v or {}).get("first_seen", "") for v in seen.values())
              print("entries:", len(seen), "| oldest:", firsts[0] if firsts else "-",
                    "| newest:", firsts[-1] if firsts else "-")
          except Exception as e:
              print("seen read failed:", str(e)[:120])

          print("=== worklog: reply/bitable/feishu for milvus + counts ===")
          try:
              lines = (root / "state" / "worklog.jsonl")                   .read_text(encoding="utf-8", errors="replace").splitlines()
          except OSError:
              lines = []
          hits = [ln for ln in lines
                  if any(k in ln for k in ("milvus#55034", "milvus#54998",
                                           "feishu_card", "pr_reply_drafted",
                                           "pr_review_fix", "bitable_sync",
                                           "pr_needs_reply", "feishu_cb"))]
          print("matched:", len(hits), "of", len(lines), "total")
          for ln in hits[-25:]:
              print(ln[:250])

          print("=== pr_replies.json statuses ===")
          try:
              rp = json.loads((root / "state" / "pr_replies.json")
                              .read_text(encoding="utf-8"))
              for k, v in rp.items():
                  print(" ", k, "->", v.get("status"),
                        "| fix:", v.get("fix_state"),
                        "| sent_at:", v.get("sent_at", ""))
          except Exception as e:
              print("read failed:", str(e)[:120])

          import subprocess as sp2, os as _os
          print("=== worklog plain tail (last 8, any kind) ===")
          try:
              all_lines = (root / "state" / "worklog.jsonl")                   .read_text(encoding="utf-8", errors="replace").splitlines()
              print("total lines:", len(all_lines))
              import datetime as _dt
              mtime = _os.path.getmtime(root / "state" / "worklog.jsonl")
              print("mtime:", _dt.datetime.fromtimestamp(mtime).isoformat())
              for ln in all_lines[-8:]:
                  print(ln[:220])
          except Exception as e:
              print("read failed:", str(e)[:120])
          print("=== hung gh processes in container ===")
          try:
              out = sp2.run(["ps", "aux"], capture_output=True, text=True, timeout=15)
              for ln in out.stdout.splitlines():
                  if " gh " in ln or ln.strip().endswith(" gh"):
                      print(ln[:200])
              gh_n = sum(1 for ln in out.stdout.splitlines() if " gh " in ln)
              print("gh processes:", gh_n)
          except Exception as e:
              print("ps failed:", str(e)[:120])
          print("=== pr_sync (worker primary channel) ===")
          try:
              ps = json.loads((root / "state" / "pr_sync.json")
                              .read_text(encoding="utf-8"))
              print("at:", ps.get("at"), "| prs:", len(ps.get("prs", [])))
          except Exception as e:
              print("read failed:", str(e)[:120])
          PY
