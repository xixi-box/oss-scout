name: Verify live Feishu queue and PR colors
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: [self-hosted, aliyun]
    timeout-minutes: 5
    steps:
      - name: Read status options and synchronized rows
        run: |
          docker exec -i -w /app oss-scout python - <<'PY'
          import collections, json, os
          from pathlib import Path
          from scout_v2 import feishu_bitable as b, feishu_app as a
          root = Path(os.environ.get("OSSCOUT_DASHBOARD_ROOT", "/data"))
          base = b._binding_app_token(root)
          binding = b.load_binding(root)
          token = a.tenant_token()
          queue = json.loads((root / "queue/candidates.json").read_text())
          for binding_key, schema, label in [("cand_table_id", b.CAND_FIELDS, "处理状态"),
                                             ("pr_table_id", b.PR_FIELDS, "PR 状态")]:
              table = binding[binding_key]
              url = f"https://open.feishu.cn/open-apis/bitable/v1/apps/{base}/tables/{table}/fields?page_size=100"
              reply = a._request("GET", url, token=token)
              assert reply["code"] == 0, reply["msg"]
              fields = reply["data"]["items"]
              assert collections.Counter(f["field_name"] for f in fields) == collections.Counter(
                  f["field_name"] for f in schema), binding_key
              field = next(f for f in fields if f["field_name"] == label)
              assert field["type"] == 3, field
              desired = next(f["property"]["options"] for f in schema if f["field_name"] == label)
              actual = {o["name"]: o["color"] for o in field["property"]["options"]}
              print(binding_key, "colors", actual)
              assert actual == {o["name"]: o["color"] for o in desired}
              records = b.load_records(base, table)
              states = collections.Counter(row["fields"].get(label) for row in records.values())
              print(binding_key, "row_counts", dict(states))
              assert set(states) <= actual.keys()
              if binding_key == "cand_table_id":
                  dates = {key: row["fields"].get("入队时间") for key, row in records.items()}
                  fallback = {key: b._timestamp(entry["staged_at"]) for key, entry in queue.items()
                              if key in dates and not entry.get("discovered_at") and entry.get("staged_at")}
                  mismatched = [key for key, expected in fallback.items() if dates[key] != expected]
                  print("date_blanks", sum(not v for v in dates.values()),
                        "staged_at_backfills", len(fallback), "mismatches", mismatched)
                  assert not mismatched
                  assert all(queue[key].get("status") != "queued" for key in dates if key in queue)
          for line in (root / "state/worklog.jsonl").read_text().splitlines()[-400:]:
              try: entry = json.loads(line)
              except ValueError: continue
              if str(entry.get("action", "")).startswith("bitable_sync"):
                  print(entry.get("ts"), entry.get("action"), entry.get("target"), entry.get("result"))
          PY
