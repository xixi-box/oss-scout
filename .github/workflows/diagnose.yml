name: Trace two screened issues in live audit
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: [self-hosted, aliyun]
    timeout-minutes: 5
    steps:
      - name: Read candidate records and publication audit
        run: |
          docker exec -i -w /app oss-scout python - <<'PY'
          import json, os, sqlite3
          from pathlib import Path
          root = Path(os.environ.get("OSSCOUT_DASHBOARD_ROOT", "/data"))
          keys = {"nodejs/node#67314", "clickhouse/clickhouse#129926", "bytedance/deer-flow#7972"}
          for filename in ("state/seen.json", "queue/candidates.json"):
              data = json.loads((root / filename).read_text())
              for key, item in data.items():
                  if key.lower() in keys:
                      print(filename, key, {k: item.get(k) for k in (
                          "status", "why", "first_seen", "discovered_at", "staged_at", "eligible_at",
                          "started_at", "updated_at", "attempts", "abort_reason", "blockers", "pr_url") if k in item})
          with sqlite3.connect((root/"state/scout_v2.sqlite3").as_uri()+"?mode=ro", uri=True) as db:
              print("publications", db.execute("SELECT day,url,repo,head,remote_id FROM publications WHERE day='2026-11-07' OR day IS NULL").fetchall())
          for line in (root / "state/worklog.jsonl").read_text().splitlines():
              try: row = json.loads(line)
              except ValueError: continue
              ts = str(row.get("ts", ""))
              action = str(row.get("action", ""))
              if (str(row.get("target", "")).lower() in keys
                  or ("2026-11-07T20:24" <= ts < "2026-11-07T21:03" and
                      action in {"pipeline_pr_open", "dispatch_error", "auto_repair_error", "orphan_requires_review"})):
                  print("audit", ts, action, row.get("target"), str(row.get("result", ""))[:650])
          PY
