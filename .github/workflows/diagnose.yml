name: Diagnose oss-scout container
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: [self-hosted, aliyun]
    steps:
      - name: Container state and logs
        run: |
          docker ps -a --filter name=oss-scout --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          echo "=== logs (last 50) ==="
          docker logs --tail 50 oss-scout 2>&1 || echo "no logs"
          echo "=== curl from host ==="
          curl -sv --max-time 5 http://127.0.0.1:18787/login 2>&1 | tail -8 || true

      - name: Credential wiring
        # 仓库公开后 token 从文件移到了 secrets（CF_API_TOKEN / CF_INGEST_TOKEN）。
        # 这里只打印"有没有"，不打印值。
        run: |
          docker exec oss-scout python -c "
import os, sys, yaml
from pathlib import Path
f = yaml.safe_load(open('/data/configs/cloudflare.yaml'))
print('file_token_empty:', f.get('api_token') in ('', None))
print('env_api_set:', bool(os.environ.get('CF_API_TOKEN')))
print('env_ingest_set:', bool(os.environ.get('CF_INGEST_TOKEN')))
sys.path.insert(0, '/app')
from dashboard import data as D
cfg = D.cloudflare_cfg(type('DS', (), {'root': Path('/data')})())
print('effective_api_set:', bool(cfg.get('api_token')))
print('effective_ingest_set:', bool(cfg.get('ingest_token')))
"
