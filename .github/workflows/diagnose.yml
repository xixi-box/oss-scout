name: Remove duplicate Feishu queue date
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: [self-hosted, aliyun]
    timeout-minutes: 5
    steps:
      - name: Merge duplicate date values and remove the duplicate field
        run: |
          docker exec -i -w /app oss-scout python - <<'PY'
          import os
          from pathlib import Path
          from scout_v2 import feishu_bitable as b, feishu_app as a
          root = Path(os.environ.get("OSSCOUT_DASHBOARD_ROOT", "/data"))
          base = b._binding_app_token(root)
          table = b.load_binding(root)["cand_table_id"]
          assert table == "tbly8KB714GtkrC4", table
          token = a.tenant_token()
          url = f"https://open.feishu.cn/open-apis/bitable/v1/apps/{base}/tables/{table}"
          def call(method, path, data=None):
              reply = a._request(method, url + path, data, token=token)
              if reply.get("code") != 0:
                  raise RuntimeError(f"{method} {path}: {reply.get('code')} {reply.get('msg')}")
              return reply.get("data") or {}
          keep, remove = "fldf9d3zKa", "fldrItFAWX"
          label, temporary = "入队时间", "入队时间（重复待删除）"
          fields = {f["field_id"]: f for f in call("GET", "/fields?page_size=100")["items"]}
          assert fields[keep]["field_name"] == label and fields[keep]["type"] == 5
          if remove in fields:
              dup = fields[remove]
              assert dup["field_name"] in {label, temporary} and dup["type"] == 5
              if dup["field_name"] == label:
                  call("PUT", f"/fields/{remove}", {"field_name": temporary, "type": 5,
                                                    "property": b.DATE_FORMAT})
              updates = []
              for rec in b.record_pages(base, table):
                  values = rec["fields"]
                  if not values.get(label) and values.get(temporary):
                      updates.append({"record_id": rec["record_id"], "fields": {label: values[temporary]}})
              for i in range(0, len(updates), 500):
                  call("POST", "/records/batch_update", {"records": updates[i:i+500]})
              call("DELETE", f"/fields/{remove}")
              print("copied_from_duplicate", len(updates))
          dates = [f["field_id"] for f in call("GET", "/fields?page_size=100")["items"]
                   if f["field_name"] == label]
          assert dates == [keep], dates
          print("single_date_field", dates[0])
          PY
