name: Migrate four Feishu ledgers to linked keys
on:
  workflow_dispatch:
    inputs:
      revision:
        required: true
        type: string
jobs:
  diag:
    runs-on: [self-hosted, aliyun]
    timeout-minutes: 10
    steps:
      - name: Verify the running sync version
        env:
          EXPECTED_REVISION: ${{ inputs.revision }}
        run: test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' oss-scout)" = "$EXPECTED_REVISION"
      - name: Migrate and verify Feishu fields
        run: docker exec -w /app oss-scout python scripts/migrate_feishu_links.py
