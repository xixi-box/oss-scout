name: Verify live scan decisions
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: [self-hosted, aliyun]
    timeout-minutes: 5
    steps:
      - name: Read the two historical scan records
        run: |
          docker exec -i -w /app oss-scout python - <<'PY'
          import json, os, time
          from pathlib import Path
          from scout_v2 import feishu_bitable as b
          root = Path(os.environ.get("OSSCOUT_DASHBOARD_ROOT", "/data"))
          app = b._binding_app_token(root)
          table = b.load_binding(root)["scan_table_id"]
          expected = {"clickhouse/clickhouse#129926": "129001", "nodejs/node#67314": "67160"}
          for attempt in range(4):
              found = {}
              for rec in b.record_pages(app, table):
                  fields = rec.get("fields") or {}
                  key = b._key_label(fields.get("键")).lower()
                  if key in expected:
                      found[key] = {k: b._norm_field(fields.get(k)) for k in ("最终结果", "粗筛结果", "细筛结果")}
                  if len(found) == len(expected):
                      break
              if all(str(found.get(key, {}).get("最终结果") or "").startswith("旧版开工检查拦截")
                     and hit in found[key]["最终结果"] for key, hit in expected.items()):
                  break
              time.sleep(15)
          print("verified_scan_rows", json.dumps(found, ensure_ascii=False))
          for key, hit in expected.items():
              row = found[key]
              assert row["最终结果"].startswith("旧版开工检查拦截") and hit in row["最终结果"], row
              assert row["粗筛结果"] == "通过" and "OpenJev" in row["细筛结果"], row
          PY
