# 仅测试 oss-scout v2 本系统自身；绝不用于扫描无关第三方项目（计划 §1/§9）。
name: v2-tests
on:
  push:
    paths: ["scout_v2/**", "dashboard/**", "tests_v2/**", "tests_dashboard/**", "configs/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # tests_v2 里有 dashboard 用例会 import fastapi/TestClient，只装
      # pyyaml+pytest 会让收集阶段直接 ImportError（整套跑不了）。httpx 是
      # TestClient 的依赖。
      - run: pip install -r requirements.txt httpx
      - run: python -m pytest tests_v2 tests_dashboard -q
