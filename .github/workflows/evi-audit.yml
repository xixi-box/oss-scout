name: evidence audit
on:
  workflow_dispatch:
jobs:
  a:
    runs-on: [self-hosted, aliyun]
    steps:
      - shell: bash
        run: |
          docker exec oss-scout python -c "
import json, collections, re
reasons = collections.Counter()
by_repo = collections.Counter()
n = 0
for line in open('/data/state/worklog.jsonl', encoding='utf-8', errors='replace'):
    try:
        r = json.loads(line)
    except Exception:
        continue
    if r.get('action') != 'pipeline_abort':
        continue
    res = str(r.get('result', ''))
    if 'evidence chain incomplete' not in res:
        continue
    n += 1
    m = re.search(r'outcome=(\S+) repro=(\S+) fixed=(\S+) gate=([^ ]+|PASS) patch=(\S+)', res)
    if m:
        reasons[(m.group(2), m.group(3), m.group(5))] += 1
    m2 = re.search(r'repos/(\S+?)/', res) or re.search(r'target (\S+)', res)
    t = r.get('target', '')
    repo = t.split('#')[0] if '#' in t else '?'
    by_repo[repo] += 1
print('total evidence failures:', n)
print('--- (repro, fixed, patch) combos ---')
for k, v in reasons.most_common(10):
    print(' ', k, v)
print('--- by repo ---')
for k, v in by_repo.most_common(12):
    print(f'  {k:40s} {v}')
"
