name: cap audit
on:
  workflow_dispatch:
jobs:
  c:
    runs-on: [self-hosted, aliyun]
    steps:
      - run: |
          docker exec oss-scout grep -n "max_new_claims" /data/configs/repositories.yaml
          echo "--- image seed ---"
          docker exec oss-scout grep -n "max_new_claims" /app/configs.seed/repositories.yaml
          echo "--- try_claim 逻辑: 同一候选重复 claim 会怎样 ---"
          docker exec oss-scout python -c "
import sys; sys.path.insert(0,'/app')
from pathlib import Path
from scout_v2.state_store import ClaimLedger
l = ClaimLedger(Path('/tmp/t.db'))
print('cap=2 下连续 claim 同一候选:')
for i in range(3):
    print('  ', l.try_claim('Asia/Shanghai','a/b#1',max_per_day=2))
print('不同候选 3 次:')
for c in ('a/b#2','a/b#3','a/b#4'):
    print('  ', c, l.try_claim('Asia/Shanghai',c,max_per_day=2))
l.close()
import os; os.remove('/tmp/t.db')
"
