name: cf token read
on: {workflow_dispatch: {}}
jobs:
  g:
    runs-on: [self-hosted, aliyun]
    steps:
      - name: read tokens
        run: |
          docker exec oss-scout python -c "
import yaml
d = yaml.safe_load(open('/data/configs/cloudflare.yaml'))
print('TOK1=' + (d.get('api_token') or ''))
print('TOK2=' + (d.get('ingest_token') or ''))
"
