name: diag bh
on:
  workflow_dispatch:
jobs:
  c:
    runs-on: [self-hosted, aliyun]
    steps:
      - run: |
          docker exec oss-scout python -c "
import json, glob
for f in sorted(glob.glob('/data/state/bughunt/*/*/findings.json')):
    d = json.load(open(f))
    repo = d.get('repo', '?')
    findings = d.get('findings') or []
    if not findings:
        continue
    print('===', repo, len(findings), '===')
    for x in findings[:3]:
        print('  [' + str(x.get('rule_id','?')) + ']', str(x.get('path','?'))+':'+str(x.get('line',0)))
        print('   ', str(x.get('message',''))[:100])
"
