name: feishu callback test
on:
  workflow_dispatch:
jobs:
  c:
    runs-on: [self-hosted, aliyun]
    steps:
      - name: challenge + submit + auth test
        run: |
          docker exec oss-scout python -c "
import json, urllib.request
BASE = 'http://oss-scout:8787'
def post(path, payload):
    req = urllib.request.Request(BASE+path, data=json.dumps(payload).encode(), method='POST', headers={'Content-Type':'application/json'})
    with urllib.request.urlopen(req, timeout=10) as r:
        return r.status, json.loads(r.read())
print('1 challenge:', post('/feishu/callback', {'type':'url_verification','url_verification':{'challenge':'xyz123','token':'t'}}))
print('2 unauth submit:', post('/feishu/callback', {'event':{'action':{'value':{'repo':'a/b','number':'1'},'form_value':{'reply_text':'x'}}}})[0])
"
