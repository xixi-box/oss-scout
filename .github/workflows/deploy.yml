name: Build and Deploy (Atomic Single-Job)

# 适用场景（与 deploy-template.yml 的区别）：
#   纯解释型语言（Python/Node 脚本等）单镜像项目——Dockerfile COPY 的全是源代码，
#   没有"预编译产物"（jar/dist）需要跨 job 中转。单 job 原子完成 checkout → build →
#   push → deploy，消灭 artifact 中转（配额敏感点）和 job 间等待。
#   多模块 Java / 多镜像并行项目请用 deploy-template.yml（pre-build + matrix）。

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: Target deployment environment / self-hosted runner label
        required: true
        default: aliyun
        type: choice
        options:
          - aliyun
          - wsl
      deploy_ref:
        description: Branch/ref to build and deploy
        required: false
        default: main
        type: string
      reuse_runtime_image:
        description: Build a code-only update on the server when hosted ACR uploads stall
        required: false
        default: false
        type: boolean

env:
  ALIYUN_ACR_REGISTRY: ${{ vars.ALIYUN_ACR_REGISTRY }}
  ALIYUN_ACR_USERNAME: ${{ vars.ALIYUN_ACR_USERNAME }}
  ALIYUN_ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
  # ALIYUN_ACR_IMAGE_NAME 默认 wangshun_build/<repository>；项目不同可在 Variables 覆盖
  ALIYUN_ACR_IMAGE_NAME: ${{ vars.ALIYUN_ACR_IMAGE_NAME || format('wangshun_build/{0}', github.event.repository.name) }}

permissions:
  contents: read
  packages: read

jobs:
  build:
    # 构建在 GitHub 托管 runner（Actions 构建）；产物只有镜像 → ACR，
    # 无 artifact 中转（存储配额免疫）。deploy job 经 SHA 标签从 ACR 拉取。
    name: Build and push to ACR
    runs-on: ${{ inputs.reuse_runtime_image && fromJSON(format('["self-hosted","{0}"]', inputs.target_env)) || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 20
    steps:
      - name: Checkout source code
        if: ${{ !inputs.reuse_runtime_image }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.deploy_ref || 'main' }}

      - name: Build code update from existing runtime
        if: inputs.reuse_runtime_image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_REF: ${{ inputs.deploy_ref }}
        run: |
          set -euo pipefail
          if [ "$REQUESTED_REF" != main ] && [ "$REQUESTED_REF" != "$GITHUB_SHA" ]; then
            echo "Server code update requires this workflow commit" >&2
            exit 1
          fi
          BUILD_DIR=$(mktemp -d /tmp/oss-scout-build.XXXXXX)
          trap 'rm -rf "$BUILD_DIR"' EXIT
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 120 \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/tarball/$GITHUB_SHA" \
            -o "$BUILD_DIR/source.tgz"
          mkdir "$BUILD_DIR/source"
          tar -xzf "$BUILD_DIR/source.tgz" -C "$BUILD_DIR/source" --strip-components=1
          BASE_IMAGE=$(docker inspect --format '{{.Image}}' oss-scout)
          docker run --rm --entrypoint cat "$BASE_IMAGE" /app/requirements.txt > "$BUILD_DIR/requirements.txt"
          cmp "$BUILD_DIR/requirements.txt" "$BUILD_DIR/source/requirements.txt" || {
            echo "Dependencies changed; a complete runtime build is required" >&2
            exit 1
          }
          cat > "$BUILD_DIR/source/RuntimeDockerfile" <<EOF
          FROM $BASE_IMAGE
          USER root
          RUN rm -rf /app/scout_v2 /app/dashboard /app/scripts /app/configs.seed /app/cloudflare /app/tests_v2
          COPY scout_v2 /app/scout_v2
          COPY dashboard /app/dashboard
          COPY scripts /app/scripts
          COPY configs /app/configs.seed
          COPY cloudflare /app/cloudflare
          COPY tests_v2 /app/tests_v2
          COPY discover.py health_check.py AGENTS.md config.json /app/
          COPY --chmod=0755 docker/entrypoint-dashboard.sh /entrypoint.sh
          USER scout
          EOF
          IMAGE="$ALIYUN_ACR_REGISTRY/$ALIYUN_ACR_IMAGE_NAME"
          printf '%s' "$ALIYUN_ACR_PASSWORD" | docker login "$ALIYUN_ACR_REGISTRY" \
            -u "$ALIYUN_ACR_USERNAME" --password-stdin
          docker build -f "$BUILD_DIR/source/RuntimeDockerfile" \
            --tag "$IMAGE:$GITHUB_SHA" --tag "$IMAGE:latest" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" "$BUILD_DIR/source"
          timeout 300 docker push "$IMAGE:$GITHUB_SHA"
          timeout 300 docker push "$IMAGE:latest"

      - name: Validate required files
        if: ${{ !inputs.reuse_runtime_image }}
        shell: bash
        run: |
          set -euo pipefail
          test -f Dockerfile || { echo "Dockerfile not found at repo root" >&2; exit 1; }
          if [ -f deploy/prod-services.yaml ]; then
            echo "prod-services.yaml present (project-owned service definitions)"
          else
            echo "no deploy/prod-services.yaml; deploying image only"
          fi

      - name: Log in to Aliyun ACR
        if: ${{ !inputs.reuse_runtime_image }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ALIYUN_ACR_REGISTRY }}
          username: ${{ env.ALIYUN_ACR_USERNAME }}
          password: ${{ env.ALIYUN_ACR_PASSWORD }}

      - name: Set up Docker Buildx
        if: ${{ !inputs.reuse_runtime_image }}
        uses: docker/setup-buildx-action@v4

      - name: Build and push to ACR (SHA + latest)
        if: ${{ !inputs.reuse_runtime_image }}
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$ALIYUN_ACR_REGISTRY/$ALIYUN_ACR_IMAGE_NAME"
          # ACR 个人版拒绝 OCI provenance/SBOM manifest（与主模板同因）
          docker buildx build \
            --provenance=false \
            --sbom=false \
            --tag "$IMAGE:${{ github.sha }}" \
            --tag "$IMAGE:latest" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --push \
            .

  deploy:
    name: Deploy to ${{ github.event.inputs.target_env }} (self-hosted)
    needs: build
    runs-on: [self-hosted, "${{ github.event.inputs.target_env }}"]
    timeout-minutes: 18
    concurrency:
      group: atomic-${{ github.repository }}-${{ github.event.inputs.target_env }}
      cancel-in-progress: false
    env:
      ALIYUN_ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
      DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      TYPESAFE_BASE_URL: ${{ vars.TYPESAFE_BASE_URL || 'https://api.codiv.ai' }}
      TYPESAFE_MODEL: ${{ vars.TYPESAFE_MODEL || 'openjev-latest' }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      # Cloudflare 凭据：2026-10-31 仓库转公开，token 从 configs/cloudflare.yaml
      # 移出，改由 Secrets 注入容器环境。
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_INGEST_TOKEN: ${{ secrets.CF_INGEST_TOKEN }}
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      # 自建应用身份：发可交互卡片（卡片内改评论 + 一键发 GitHub）并校验回调
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_VERIFICATION_TOKEN: ${{ secrets.FEISHU_VERIFICATION_TOKEN }}
      # 可选：固定通知群 ID。设了就不需要 im:chat:readonly 权限去列群
      FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
      FEISHU_PR_APPROVER_OPEN_ID: ${{ secrets.FEISHU_PR_APPROVER_OPEN_ID }}
      # PR 台账所在的多维表格（用户自建并分享给应用的 base）
      FEISHU_BITABLE_APP_TOKEN: ${{ secrets.FEISHU_BITABLE_APP_TOKEN }}
    steps:
      # 不 checkout：阿里云到 GitHub 的 git 协议不通（TLS/大包被拦，实测 130s 超时）。
      # 部署只需 ACR 镜像 + 服务定义，全部内联在此（不依赖仓库文件）。
      - name: Deploy to self-hosted runner
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$ALIYUN_ACR_REGISTRY/$ALIYUN_ACR_IMAGE_NAME"

          # ---- 环境校验（部署机 secrets 独立一套：runner 环境里配置或仓库 environment）----
          missing=()
          [ -n "$ALIYUN_ACR_PASSWORD" ] || missing+=(ALIYUN_ACR_PASSWORD)
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing secrets on this runner context: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          DEPLOY_DIR="$HOME/deployments/$(basename '${{ github.repository }}')"
          mkdir -p "$DEPLOY_DIR"

          # 服务定义内联（deploy job 不 checkout）；/opt/oss-scout-data 持久化 state/queue/artifacts
          cat > "$DEPLOY_DIR/compose.yaml" <<COMPOSE
          services:
            oss-scout:
              image: $IMAGE:${{ github.sha }}
              container_name: oss-scout
              restart: unless-stopped
              ports:
                # 127.0.0.1 = 宿主机本机访问；172.17.0.1 = docker0 网桥，
                # 供同机 nginx gateway 容器经 host.docker.internal 反代（不暴露公网）
                - "127.0.0.1:18787:8787"
                - "172.17.0.1:18787:8787"
              volumes:
                - /opt/oss-scout-data:/data
              environment:
                - TZ=Asia/Shanghai
                - OSSCOUT_DASHBOARD_ROOT=/data
                - DASHBOARD_PASSWORD=\${DASHBOARD_PASSWORD}
                - GH_TOKEN=\${GH_TOKEN}
                - OPENCODE_API_KEY=\${OPENCODE_API_KEY}
                - TYPESAFE_API_KEY=\${TYPESAFE_API_KEY}
                - TYPESAFE_BASE_URL=\${TYPESAFE_BASE_URL}
                - TYPESAFE_MODEL=\${TYPESAFE_MODEL}
                - MODAL_TOKEN_ID=\${MODAL_TOKEN_ID}
                - MODAL_TOKEN_SECRET=\${MODAL_TOKEN_SECRET}
                - CF_API_TOKEN=\${CF_API_TOKEN}
                - CF_INGEST_TOKEN=\${CF_INGEST_TOKEN}
                - FEISHU_WEBHOOK_URL=\${FEISHU_WEBHOOK_URL}
                - FEISHU_APP_ID=\${FEISHU_APP_ID}
                - FEISHU_APP_SECRET=\${FEISHU_APP_SECRET}
                - FEISHU_VERIFICATION_TOKEN=\${FEISHU_VERIFICATION_TOKEN}
                - FEISHU_CHAT_ID=\${FEISHU_CHAT_ID}
                - FEISHU_PR_APPROVER_OPEN_ID=\${FEISHU_PR_APPROVER_OPEN_ID}
                - FEISHU_BITABLE_APP_TOKEN=\${FEISHU_BITABLE_APP_TOKEN}
                # git/外网经宿主 sing-box（docker0 网桥入站）；国内直连域走 NO_PROXY
                - HTTPS_PROXY=http://172.17.0.1:7890
                - HTTP_PROXY=http://172.17.0.1:7890
                - NO_PROXY=localhost,127.0.0.1,aliyuncs.com,.aliyuncs.com,crpi-.cn-shanghai.personal.cr.aliyuncs.com
              healthcheck:
                test: ["CMD", "curl", "-sf", "http://127.0.0.1:8787/healthz"]
                interval: 60s
                timeout: 10s
                retries: 3
          COMPOSE
          # runner 进程环境里的 secrets 写入 .env 供 compose 插值
          {
            echo "DASHBOARD_PASSWORD=$DASHBOARD_PASSWORD"
            echo "GH_TOKEN=$GH_TOKEN"
            echo "OPENCODE_API_KEY=$OPENCODE_API_KEY"
            echo "TYPESAFE_API_KEY=$TYPESAFE_API_KEY"
            echo "TYPESAFE_BASE_URL=$TYPESAFE_BASE_URL"
            echo "TYPESAFE_MODEL=$TYPESAFE_MODEL"
            echo "MODAL_TOKEN_ID=$MODAL_TOKEN_ID"
            echo "MODAL_TOKEN_SECRET=$MODAL_TOKEN_SECRET"
            echo "CF_API_TOKEN=$CF_API_TOKEN"
            echo "CF_INGEST_TOKEN=$CF_INGEST_TOKEN"
            echo "FEISHU_WEBHOOK_URL=$FEISHU_WEBHOOK_URL"
            echo "FEISHU_APP_ID=$FEISHU_APP_ID"
            echo "FEISHU_APP_SECRET=$FEISHU_APP_SECRET"
            echo "FEISHU_VERIFICATION_TOKEN=$FEISHU_VERIFICATION_TOKEN"
            echo "FEISHU_CHAT_ID=$FEISHU_CHAT_ID"
            echo "FEISHU_PR_APPROVER_OPEN_ID=$FEISHU_PR_APPROVER_OPEN_ID"
            echo "FEISHU_BITABLE_APP_TOKEN=$FEISHU_BITABLE_APP_TOKEN"
          } > "$DEPLOY_DIR/.env"
          chmod 600 "$DEPLOY_DIR/.env"
          echo "compose written to $DEPLOY_DIR/compose.yaml"

          for attempt in 1 2 3; do
            if echo "$ALIYUN_ACR_PASSWORD" | timeout 45 docker login "$ALIYUN_ACR_REGISTRY" -u "$ALIYUN_ACR_USERNAME" --password-stdin; then
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 10
          done
          # 数据目录属主必须是容器运行用户（scout=1000），否则 entrypoint 无法 seed / 写状态
          mkdir -p /opt/oss-scout-data/{state/runs,queue,artifacts,configs}
          chown -R 1000:1000 /opt/oss-scout-data 2>/dev/null || true
          docker compose -f "$DEPLOY_DIR/compose.yaml" pull
          docker compose -f "$DEPLOY_DIR/compose.yaml" up -d --remove-orphans
          # 清理同仓库旧镜像（保留本次 SHA 与 latest）。
          # 只清 dangling 不够：带 tag 的历史版本会永久堆积（2026-10-27 磁盘打满事故）
          KEEP_SHA="${{ github.sha }}"
          docker images --format '{{.Repository}}:{{.Tag}}'             | grep "^$ALIYUN_ACR_REGISTRY/$ALIYUN_ACR_IMAGE_NAME:"             | grep -v ":$KEEP_SHA$" | grep -v ":latest$"             | xargs -r docker rmi -f > /dev/null 2>&1 || true
          docker image prune -f > /dev/null 2>&1 || true
          docker compose -f "$DEPLOY_DIR/compose.yaml" ps || docker ps --format '{{.Names}} {{.Status}}' | head -5

      - name: Verify deployed runtime
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 5 http://127.0.0.1:18787/healthz > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS --max-time 5 http://127.0.0.1:18787/healthz > /dev/null
          docker exec oss-scout python /app/scripts/runtime_status.py --screening
          docker exec oss-scout python /app/scripts/verify_service.py

      - name: Verify Feishu repository pool
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if docker exec oss-scout python /app/scripts/runtime_status.py --feishu-repos; then
              exit 0
            fi
            sleep 10
          done
          exit 1
