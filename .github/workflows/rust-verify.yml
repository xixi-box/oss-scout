name: rust-verify
on:
  workflow_dispatch:
    inputs:
      repo:
        description: "fork repo"
        required: true
        type: string
      branch:
        description: "branch"
        required: true
        type: string
      pkg:
        description: "cargo test -p <pkg>"
        required: true
        type: string
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.branch }}
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p ${{ inputs.pkg }} 2>&1 | tail -40
