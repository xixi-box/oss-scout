name: bug hunter daily

# 每日 bug hunter 扫描（Modal 沙箱执行，本 job 只负责触发与汇总）。
# cron 是 UTC：20:00 UTC = 上海时间 04:00（configs/v2.yaml 的
# bug_hunter.daily_scan_hour_local）。跑在 self-hosted 上——调度编排是本仓库
# 自己的工作，合规；真正的第三方扫描全部发生在 Modal 沙箱里。
on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      repos:
        description: "How many MVP repos to scan"
        default: "5"
jobs:
  hunt:
    runs-on: [self-hosted, aliyun]
    timeout-minutes: 60
    steps:
      - name: Scan (Modal sandboxes)
        shell: bash
        run: |
          set -uo pipefail
          REPOS="${{ inputs.repos || 5 }}"
          docker exec oss-scout python /app/scripts/p6_bug_hunter.py --yes \
            --repos "$REPOS" 2>&1 | tail -80

      - name: Findings summary
        if: always()
        shell: bash
        run: docker exec oss-scout python /app/scripts/bh_summary.py || true
