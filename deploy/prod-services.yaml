# oss-scout v2 应用服务（template 约定：服务定义归项目，镜像引用模板导出变量）
services:
  oss-scout:
    image: ${OSS_SCOUT_IMAGE}
    container_name: oss-scout
    restart: unless-stopped
    ports:
      - "127.0.0.1:18787:8787"   # 宿主 18787（8787 被 ops-agent 占用）；容器内仍 8787
    volumes:
      - /home/scoutdeploy/oss-scout-data:/data   # state/queue/artifacts/configs 持久化
    environment:
      - OSSCOUT_DASHBOARD_ROOT=/data
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD}
      - GH_TOKEN=${GH_TOKEN}
      - OPENCODE_API_KEY=${OPENCODE_API_KEY}
      - MODAL_TOKEN_ID=${MODAL_TOKEN_ID}
      - MODAL_TOKEN_SECRET=${MODAL_TOKEN_SECRET}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8787/login"]
      interval: 60s
      timeout: 10s
      retries: 3
