# oss-scout Issue Hunter Worker 配置模板。
# 复制为 wrangler.toml 后填入你的 KV namespace id，再 `npx wrangler deploy`。
# Secrets（不要写进本文件）：npx wrangler secret put GH_TOKEN / INGEST_URL / INGEST_TOKEN

name = "oss-scout-hunter"
main = "worker.js"
compatibility_date = "2026-10-01"

[triggers]
crons = ["* * * * *"]   # 每分钟一次

[[kv_namespaces]]
binding = "SEEN"
id = "<你的 KV namespace id>"

[vars]
# 监控仓库列表（逗号分隔；与 config.json 的 open_pool 保持一致）
REPOS = "aaif-goose/goose,openai/openai-agents-python,browser-use/browser-use,OpenHands/software-agent-sdk,OpenHands/OpenHands,deepset-ai/haystack,langfuse/langfuse,Arize-ai/phoenix,anomalyco/opencode,langchain-ai/langsmith-sdk,e2b-dev/e2b,infiniflow/ragflow,openai/openai-python,crewAIInc/crewAI"
# INGEST_URL = "http://<你的主机>:8787/api/cloudflare/ingest"（作为 secret 配置）
# 注意：Worker 在公网回传本机 ingest 端点需要可达地址（Tailscale/内网穿透/公网部署时）。
