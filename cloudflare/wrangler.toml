# 复制为 wrangler.toml 使用。部署不需要 wrangler login：
#   set CLOUDFLARE_API_TOKEN=<你的 API Token> 后直接跑 wrangler 命令（见 README）

name = "oss-scout-hunter"
main = "worker.js"
compatibility_date = "2026-10-01"

[triggers]
crons = ["* * * * *"]   # 每分钟一次

[[kv_namespaces]]
binding = "SEEN"
id = "06f5c54ef44a4e3ab31f7cf0e45646cc"

[vars]
REPOS = "python/cpython,tiangolo/sqlmodel,encode/starlette,django/django,sqlalchemy/sqlalchemy,pdm-project/pdm,jlowin/fastmcp,run-llama/llama_index,geekan/MetaGPT,microsoft/autogen,google-gemini/gemini-cli,bytedance/deer-flow,agentgateway/agentgateway,milvus-io/milvus,pgvector/pgvector,volcengine/OpenViking,oceanbase/powercontext,HKUDS/RAG-Anything,OSU-NLP-Group/HippoRAG,ruvnet/RuVector,kubernetes/kubernetes,istio/istio,envoyproxy/envoy,traefik/traefik,caddyserver/caddy,containerd/containerd,moby/moby,docker/compose,etcd-io/etcd,minio/minio,prometheus/prometheus,firecracker-microvm/firecracker,dagger/dagger,clickhouse/clickhouse,cockroachdb/cockroach,valkey-io/valkey,redis/redis,apache/kafka,psf/black,prettier/prettier,nodejs/node,pypa/pip,pypa/pipx,pypa/virtualenv,pypa/pip-tools,tox-dev/tox,python-poetry/poetry,logseq/logseq,yjs/yjs,sharkdp/bat"
