# 复制为 wrangler.toml 使用。部署不需要 wrangler login：
#   set CLOUDFLARE_API_TOKEN=<你的 API Token> 后直接跑 wrangler 命令（见 README）

name = "oss-scout-hunter"
main = "worker.js"
compatibility_date = "2026-10-01"

[triggers]
crons = ["* * * * *"]   # 每分钟一次

[[kv_namespaces]]
binding = "SEEN"
id = "06f5c54ef44a4e3ab31f7cf0e45646cc"

[vars]
REPOS = "agentgateway/agentgateway,clickhouse/clickhouse,modelcontextprotocol/rust-sdk,qdrant/qdrant,ruvnet/RuVector,bytecodealliance/wasmtime,apache/rocketmq,agentscope-ai/agentscope-java,kgateway-dev/kgateway,spring-projects/spring-boot,rancher/rancher,python/typeshed,PyO3/pyo3,redis/redis-py,bytecodealliance/wasm-tools,bytecodealliance/jco,infiniflow/ragflow,bytedance/deer-flow,NVIDIA/NeMo-Agent-Toolkit,psf/black,istio/istio,pypa/pipx,tox-dev/tox,caddyserver/caddy,dapr/dapr,moby/buildkit,docker/compose,firecracker-microvm/firecracker,milvus-io/milvus,envoyproxy/envoy,volcengine/OpenViking,traefik/traefik,pypa/virtualenv,docling-project/docling,Unstructured-IO/unstructured,apache/dubbo-go,oceanbase/powercontext,prettier/prettier,pydantic/monty,oras-project/oras,python-poetry/poetry,pypa/pip,redis/go-redis,valkey-io/valkey,pydantic/logfire,rclone/rclone,prometheus/prometheus,django/django,HKUDS/RAG-Anything,dagger/dagger"
